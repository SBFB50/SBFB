[project]
name = "nexus"
version = "0.2.0"
description = "Cold Case Investigation System — autonomous, persistent, event-driven"
requires-python = ">=3.13"
readme = "README.md"

# -------------------------------------------------------------------
# uv workspace (SBFB pivot, Sprint 1)
# -------------------------------------------------------------------
# Declares the monorepo layout for uv. The root `nexus` project stays
# the active Python codebase during Sprints 1-3. Sprint 4 will start
# populating packages/ with nexus-coordinator, nexus-sdk, nexus-app-*
# and migrate nexus/gov/, nexus/core/, nexus/forensics/ out of the
# root package.
#
# crates/nexus-core-py ships a Python wheel built via maturin (see
# crates/nexus-core-py/pyproject.toml), providing the `nexus_core`
# module that wraps iroh/docs/gossip/blobs from nexus-core-rs.

[tool.uv.workspace]
members = [
    "crates/nexus-core-py",
    "packages/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30

[tool.ruff]
line-length = 120
target-version = "py313"
# Exclude Rust crates and future workspace packages from Python linting
extend-exclude = ["crates", "packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter
