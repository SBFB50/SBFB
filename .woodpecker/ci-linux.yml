#
# nexus-grid CI Linux — Woodpecker pipeline reproducing the Linux
# verification bloc from .github/workflows/ci.yml.
#
# Runs on Codeberg CI or self-hosted Woodpecker agent.
# Sprint 52 Phase B — first step toward GHA independence.
# Sprint 54 Phase D — images pinned to SHA256 digests (SLSA supply chain).

when:
  branch: [master, main]
  event: [push, pull_request, manual]

steps:
  # ── Rust ──────────────────────────────────────────────────
  - name: rust-fmt
    image: rust:1.94@sha256:b644cc33aee7a2b32ff3e1198711f8ad3a69ae29a58e1a674e97f75776b88186
    commands:
      - rustup component add rustfmt
      - cargo fmt --all --check

  - name: rust-clippy
    image: rust:1.94@sha256:b644cc33aee7a2b32ff3e1198711f8ad3a69ae29a58e1a674e97f75776b88186
    commands:
      # nexus-launcher links GTK on Linux (tray-icon/muda gtk feature);
      # --workspace --all-targets needs libgtk-3-dev. No sudo: root in-image.
      # Mirrors docker/ci/Dockerfile.
      - apt-get update && apt-get install -y --no-install-recommends libgtk-3-dev
      - rustup component add clippy
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  - name: rust-test
    image: rust:1.94@sha256:b644cc33aee7a2b32ff3e1198711f8ad3a69ae29a58e1a674e97f75776b88186
    commands:
      # nexus-launcher links GTK on Linux; --workspace needs libgtk-3-dev.
      # No sudo: root in-image. Mirrors docker/ci/Dockerfile.
      - apt-get update && apt-get install -y --no-install-recommends libgtk-3-dev
      - cargo test --workspace --locked

  - name: rust-doctest
    image: rust:1.94@sha256:b644cc33aee7a2b32ff3e1198711f8ad3a69ae29a58e1a674e97f75776b88186
    commands:
      # nexus-launcher links GTK on Linux; --workspace needs libgtk-3-dev.
      # No sudo: root in-image. Mirrors docker/ci/Dockerfile.
      - apt-get update && apt-get install -y --no-install-recommends libgtk-3-dev
      - cargo test --workspace --locked --doc

  # ── Frontend ──────────────────────────────────────────────
  - name: frontend-deps
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd web && npm ci

  - name: frontend-typecheck
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd web && npx tsc --noEmit -p tsconfig.app.json

  - name: frontend-lint
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd web && npm run lint

  - name: frontend-test
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd web && npm run test:unit

  - name: frontend-build
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd web && npm run build

  - name: frontend-size
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd web && npm run size

  - name: spdx-check
    image: bash:5@sha256:2003051c5eb5154cbd44fd4b1a2b8f1be886517b383813c998c72cb15840357f
    commands:
      - bash scripts/check-spdx.sh

  - name: sharding-docs-check
    image: bash:5@sha256:2003051c5eb5154cbd44fd4b1a2b8f1be886517b383813c998c72cb15840357f
    commands:
      - bash scripts/check-sharding-docs.sh

  - name: frontier-contracts-check
    image: bash:5@sha256:2003051c5eb5154cbd44fd4b1a2b8f1be886517b383813c998c72cb15840357f
    commands:
      - bash scripts/check-frontier-contracts.sh

  - name: factory-docs-check
    image: bash:5@sha256:2003051c5eb5154cbd44fd4b1a2b8f1be886517b383813c998c72cb15840357f
    commands:
      - bash scripts/check-factory-docs.sh

  # ── Factory Operator greenfield front (Sprint 80 Phase B) ──
  # Discipline gates + build/size. The hermetic T1 (Playwright + the
  # Operator Rust binary) runs in GHA `ci.yml`; Woodpecker keeps the
  # lighter front gates so the Codeberg mirror stays fast.
  - name: factory-operator-deps
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd tools/factory-operator && npm ci

  - name: factory-operator-tsc
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd tools/factory-operator && npx tsc --noEmit -p tsconfig.app.json

  - name: factory-operator-lint
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd tools/factory-operator && npm run lint

  # Sprint 80 Phase I: the Vitest suite (incl. the PO-14 single-Done
  # re-coverage) is gated at EVERY push, on both CI surfaces.
  - name: factory-operator-vitest
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd tools/factory-operator && npm run test:unit

  - name: factory-operator-gates
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd tools/factory-operator && npm run gates

  - name: factory-operator-build
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd tools/factory-operator && npm run build

  - name: factory-operator-size
    image: node:20@sha256:cacf10e99285cbbc891452e31249c1b5ec3ba225f40028fae946b75aeaf1b66a
    commands:
      - cd tools/factory-operator && npm run size
