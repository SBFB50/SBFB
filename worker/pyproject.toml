[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-worker"
version = "0.1.0"
description = "Distributed GPU contributor client for NEXUS GOV — share your GPU for political transparency"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "NEXUS GOV"},
]
keywords = ["gpu", "distributed", "llm", "nexus", "political", "transparency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
    "loguru>=0.7",
    "rich>=13.0",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.0"]

[project.scripts]
nexus-worker = "worker.cli:main"

[tool.setuptools.packages.find]
include = ["worker*"]
