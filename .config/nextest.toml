# cargo-nextest configuration.
#
# The `ci` profile is what `.github/workflows/rust-ci.yml` runs.
# Keep the defaults tight: we want CI to surface flakes loudly
# instead of hiding them under silent retries, but we also allow a
# single retry to absorb truly transient QUIC handshake hiccups in
# `blobs::tests::two_nodes_fetch_blob_via_ticket` and
# `docs::tests::two_nodes_sync_via_share_import` (direct-only
# loopback since S81 Phase K — no public relay in the path).
#
# If a test retries successfully, the `status-level = "retry"` line
# makes nextest print the retry as "PASS (retry N)" in the summary,
# so reviewers can tell the difference between "first-try green" and
# "flaked once, recovered".
#
# Schema reference: https://nexte.st/book/configuration.html

# S81 Phase C: the dispatch_loop convergence scenarios each boot TWO
# real iroh nodes (QUIC handshake + gossip + doc sync). Running all
# eleven of them concurrently with the rest of the workspace starves
# the handshakes on a saturated CPU: observed green solo in ~2s but
# past a 20-30s deadline under the full parallel run (false flakes on
# genuinely-converging tests). Cap their parallelism instead of
# inflating deadlines forever — `await_exact_key`/`await_neighbor`
# return as soon as the event lands, so serialization costs seconds.
[test-groups]
two-node-convergence = { max-threads = 2 }

[profile.default]
# Local dev: no retries, fail fast on first failure. This keeps
# `cargo nextest run` on a developer laptop as loud as possible.
retries = 0
slow-timeout = { period = "30s", terminate-after = 3 }
failure-output = "immediate"
status-level = "pass"

[[profile.default.overrides]]
filter = 'package(nexus-shell-daemon) & test(/(convergence_|without_start_sync|reenters_sync_set|duress_skips_sync_set)/)'
test-group = 'two-node-convergence'
# The group caps intra-group parallelism, but the REST of the workspace
# still saturates the CPU around these tests (the alphabetically-first
# group member lands in the initial spike and its QUIC handshake can
# take >30s that costs ~2s solo). Give the group a wider terminate
# budget so a slow-but-correct convergence is not killed at 90s.
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
# CI: do not stop the whole run on the first failure — we want the
# matrix run to surface every broken test at once, not just the
# first one.
fail-fast = false

# Single retry for EVERY test run under this profile — the [profile.ci]
# scope includes the nightly `binary(multi_daemon)` job
# (integration-nightly.yml), not only the two iroh 2-node tests
# (blobs::two_nodes_fetch_blob_via_ticket,
# docs::two_nodes_sync_via_share_import) that motivated it. S81 Phase K
# stripped those two tests' exchanged addrs to DIRECT-ONLY, so they no
# longer touch the public n0 relay (EOL 2026-09-30); the single retry
# stays only to absorb transient loopback QUIC handshake hiccups on
# saturated CI runners. Anything that still fails after one retry is a
# real bug and must be fixed, not hidden behind more retries.
retries = 1

# Tests should complete within 30s each. If one runs slower, warn
# (keeps running), and if it blows past 90s (3 × 30s) nextest
# terminates it and records a failure. This bounds CI time even if
# a test hangs on a disconnected socket.
slow-timeout = { period = "30s", terminate-after = 3 }

# Print each failing test's output in full at the end of the run
# so CI log readers can scroll to "immediate-final" and see
# everything without expanding collapsed groups.
failure-output = "immediate-final"
status-level = "retry"

# Emit a JUnit XML report at `target/nextest/ci/junit.xml` so the
# workflow can upload it as an artifact and (later) feed it to
# result dashboards.
[profile.ci.junit]
path = "junit.xml"
report-name = "nexus-core-rs"
