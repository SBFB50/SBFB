[package]
name = "nexus-shell-daemon-core"
description = "SBFB nexus-shell-daemon headless engine — UI-free library used by the nexus-shell-daemon binary and any alternative frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "nexus_shell_daemon_core"
path = "src/lib.rs"

[dependencies]
# The shell-daemon is the second user of nexus-core-rs after the
# worker. In Phase A it only calls `create_node()` at boot so the
# iroh endpoint is ready for the Phase C curator subscribe wiring,
# but it does not yet consume any of the gossip / blobs / docs
# APIs. The dep is pulled in now so the Phase A runtime already
# owns a live `Node`.
nexus-core-rs = { path = "../nexus-core-rs" }

# Async runtime. The daemon runtime is async throughout so the
# binary (and any alternative frontend) can spin it up on a tokio
# runtime of its choice.
tokio = { workspace = true }

# Serialization for the running.json singleton file and the
# DaemonStateSnapshot schema v1 exposed over HTTP in Phase A.
serde = { workspace = true }
serde_json = { workspace = true }

# Sprint 21 Phase E (T-NN tech debt resolved) — JCS canonical
# (RFC 8785) for `canary_wire_bytes` so the gossip transport
# bytes are byte-identical cross-language. Aligns the canary on
# the project-wide JCS pattern adopted Sprint 4 Day 0 (1c1fcfb)
# for Task / Result / Claim / Curator. Signing path was already
# JCS via `nexus_core_rs::canonical_bytes`; only the wire
# transport was the odd-one-out.
serde_jcs = { workspace = true }

# TOML (de)serialization for the on-disk `config.toml` the shell
# daemon reads / writes under `<root>/shell-daemon/`. Matches the
# `toml = "0.8"` pin the worker-core Cargo.toml already uses.
toml = { workspace = true }

# Cross-platform application directory resolution. Shared with
# `nexus_worker_core::paths` — we duplicate the tiny helper here
# on purpose rather than creating a crate-level dependency between
# two sibling crates that have no other reason to couple.
directories = { workspace = true }

# Sprint 5 Phase A pattern: RFC 3339 timestamps in the
# running.json and DaemonStateSnapshot outputs so the shell
# renderer can display a human-friendly "started at" / "last
# updated" string without re-parsing epoch seconds.
time = { workspace = true }

# Singleton enforcement (D2). The registry module uses
# `sysinfo::System` to ask whether the pid recorded in a
# leftover running.json still belongs to a live
# `nexus-shell-daemon` process. The process name comparison
# mitigates R3 (pid recycled across reboots on Windows).
sysinfo = { workspace = true }

# The Phase C curator runtime stores in-memory curator lists in
# a `DashMap<curator_pubkey, CuratorListEntry>`. Declared here so
# the Phase A skeleton already pulls the crate in and Phase C
# doesn't have to churn the Cargo.toml.
dashmap = { workspace = true }

# Phase C gossip topic derivation: the curator-list topic id is
# `blake3("nexus-grid/curator/v1")[..32]`, a single deterministic
# topic every shell daemon in the network joins. The hash lives
# in a const so the Sprint 7 verification can grep for the exact
# seed string.
blake3 = { workspace = true }

# Phase C attention-set persistence (R7 mitigation): the set of
# curator pubkeys the user has subscribed to is stored as hex
# strings in `subscriptions.json`. Hex encoding matches the
# coordinator / worker wire formats for crypto identities, so a
# user copying a pubkey between subsystems sees the same
# representation everywhere.
hex = { workspace = true }

# Observability — the headless engine logs everything through
# tracing. The binary configures the subscriber; this crate only
# emits events so it stays agnostic to how they get consumed
# (stdout, file, future GUI widget, ...).
tracing = { workspace = true }

# Error handling.
anyhow = { workspace = true }
thiserror = { workspace = true }

# Sprint 12 Phase A: zip archive decompression for the blob-serve
# cache. Used by `blob_serve::BlobServeCache` to extract archived
# web apps and serve them file-by-file.
zip = { workspace = true }

# Sprint 16 Phase A (D1): loopback auth middleware lives in this
# crate (headless engine), wired from the binary. Needs axum +
# tower for the middleware layer and rand for the 256-bit token
# CSPRNG. (hex + tracing already declared above.)
axum = { workspace = true }
tower = { workspace = true }
rand = { workspace = true }

# Sprint 18 Phase E2: the `CanaryBroadcaster` trait is
# async-trait so the binary can implement it over an iroh
# `TopicHandle` while the unit tests implement it over a
# `Vec<Vec<u8>>`-backed mock. `async-trait` matches the
# nexus-core-rs / nexus-worker-core choice for the same
# pattern, keeping the workspace single-style.
async-trait = { workspace = true }

# Sprint 18 audit fix D-1: file-watcher pour tokens.json, picked up
# par le daemon HTTP layer pour rotation effective sans restart.
# Meme crate / meme version que ConsentWatcher cote nexus-worker-core
# (Sprint 16 Phase C) — pattern eprouve, debouncer 50 ms, watch sur
# le parent dir pour recuperer write+rename atomiques.
notify = { workspace = true }

# Sprint 20 Phase E.2: FROST threshold signatures over Ed25519
# (RFC 9591 jan 2025, ZcashFoundation reference impl, ToB audit
# 2023). Backs the opt-in `FrostCanarySigner` in
# `src/canary/frost.rs` — `aggregate()` returns a 64-byte Ed25519
# signature byte-identical to a standalone RFC 8032 sig so
# verifiers keep using the existing `nexus_core_rs::crypto::verify`
# path unchanged. Pulls only the FROST primitive (~30 KiB compiled
# into the daemon binary) ; no extra TLS / async / runtime deps.
frost-ed25519 = { workspace = true }

# Deliberately excluded: clap, ratatui, crossterm, axum, tower,
# tower-http. The shell-daemon has no TUI (headless-only per
# Sprint 7 D1) and the HTTP server layer lives in the binary
# crate alongside its subcommand dispatch. See the
# Sprint 7 Phase A plan §4.1 for the split rationale.

[dev-dependencies]
# Used by the registry, config and paths tests to produce
# isolated per-test filesystems so a save/load/stale test
# never touches a real `~/.nexus-grid/` on the developer's
# machine.
tempfile = "3.12"

# Phase C 2-node integration test: `iroh_runtime::tests::two_nodes_*`
# spawn one publisher node + one subscriber daemon runtime in the
# same process, mint a BlobTicket on the publisher, and assert the
# subscriber's DashMap absorbs the signed entry end-to-end. Mirrors
# the `nexus-core-rs/src/blobs.rs::tests::two_nodes_fetch_blob_via_ticket`
# test that landed as a Sprint 2 audit fix; the ticket-minting
# path requires the raw `iroh_blobs` types (`BlobTicket`, `Hash`,
# `BlobFormat`) that are not re-exported through nexus-core-rs.
iroh-blobs = { workspace = true }
# The 2-node test needs `iroh::EndpointAddr` for the
# `mint_ticket` helper signature — the raw type is returned by
# `nexus_core_rs::DiscoveryClient::my_endpoint_addr` and
# consumed by `iroh_blobs::ticket::BlobTicket::new`. Declared
# as a dev-dep rather than a main dep to keep the production
# surface going through the nexus-core-rs wrapper.
iroh = { workspace = true }
# `tokio::test` macro + the Phase C integration test wants access
# to `tokio::time::timeout` to bound 2-node waits. `tokio` itself
# is a non-dev workspace dep above, but the "macros" feature is
# needed at test time.
tokio = { workspace = true, features = ["macros", "time", "rt-multi-thread"] }
