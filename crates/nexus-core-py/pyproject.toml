[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "nexus-core-py"
description = "SBFB nexus-core Python bindings — iroh P2P compute wrapper"
version = "0.1.0"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [{ name = "FlowUP" }]
keywords = ["p2p", "iroh", "llm", "distributed", "compute", "sbfb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Distributed Computing",
]

[tool.maturin]
# Tell maturin the Rust crate name (`nexus_core` in Cargo.toml [lib])
# differs from the package name (`nexus-core-py` on PyPI). The Python
# import will be `import nexus_core`.
module-name = "nexus_core"
features = ["pyo3/extension-module"]
