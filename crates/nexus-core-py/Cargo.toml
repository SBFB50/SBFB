[package]
name = "nexus-core-py"
description = "SBFB nexus-core Python bindings (PyO3 wheel, exposes `nexus_core` module)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "nexus_core"
# cdylib for the Python extension module (shipped as a wheel via
# maturin). rlib is kept so Rust integration tests can link against
# the same crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
nexus-core-rs = { path = "../nexus-core-rs" }
nexus-events-core = { path = "../nexus-events-core" }

pyo3 = { workspace = true }
pyo3-async-runtimes = { workspace = true }
tokio = { workspace = true }

# Needed for parsing ticket and author id strings in the Python
# Doc bindings, and for (de)serializing TaskEntry/ResultEntry JSON
# in the free-function sign/verify surface.
iroh-docs = { workspace = true }
serde_json = { workspace = true }

# nexus-worker-core owns the invite format; we depend on it only
# for the mint/decode bindings exposed through PyO3 (pulling the
# whole worker engine into a Python wheel is intentional — the
# Rust types stay the single source of truth even for coordinator
# writes).
nexus-worker-core = { path = "../nexus-worker-core" }

# Sprint 21 Phase E (T-NN+1 tech debt resolved) — nexus-shell-
# daemon-core owns the warrant canary type. We depend on it only
# for the `verify_canary` binding consumed by the coordinator's
# CanaryRegistry to verify Ed25519 signatures at ingest (closes
# the Sprint 20 Phase E observational-only gap that accepted any
# payload as valid). Same rationale as `nexus-worker-core` above :
# Rust types stay the single source of truth, the coordinator
# never re-implements canary parsing or signature verification in
# Python.
nexus-shell-daemon-core = { path = "../nexus-shell-daemon-core" }

# Sprint 21 Phase E — `time` for the `build_canary` test-surface
# binding (Date::parse on YYYY-MM-DD strings). Same crate /
# feature set as nexus-shell-daemon-core, no new transitive deps.
time = { workspace = true }

# Stream polling for Doc::subscribe binding. futures-lite is the
# same dep nexus-core-rs already uses in its gossip/docs wrappers,
# so we match the workspace choice rather than pulling futures
# proper.
futures-lite = "2.3"

tracing = { workspace = true }

[build-dependencies]
# maturin reads the Cargo.toml + the pyproject.toml next to it to
# produce the Python wheel. No explicit build script needed for a
# standard PyO3 extension.
