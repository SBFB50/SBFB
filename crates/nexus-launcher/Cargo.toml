[package]
name = "nexus-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Minimal SBFB launcher — spawns daemon, opens browser, waits for Ctrl+C."

[[bin]]
name = "nexus-launcher"
path = "src/main.rs"

[dependencies]
open = "5"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Sprint 16 Phase A (D1): bearer token + auth HTTP server.
# Reuses nexus-shell-daemon-core::auth for the token generation
# and the loopback host/origin predicates so the launcher and
# daemon share exactly one validation surface.
nexus-shell-daemon-core = { path = "../nexus-shell-daemon-core" }
axum = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

# Sprint 20 Phase A : `sbfb init` / `sbfb unlock` subcommands use
# the `LocalFileKeyStore` from nexus-core-rs to derive the PIN +
# write / read the encrypted blob. The launcher already talks to
# the daemon through the shell-daemon-core path; pulling the core
# crate in directly keeps the keystore API in a single crate
# rather than duplicating the type inside launcher.
nexus-core-rs = { path = "../nexus-core-rs" }
hex = { workspace = true }
# `zeroize` wipes the intermediate hex string the launcher builds
# just before exporting it to the SBFB_IDENTITY_SECRET_HEX env var.
# `secrecy` is NOT pulled: the launcher only sees the raw bytes
# transiently — it hands them straight to the daemon child — so
# adding a SecretBox wrap here would be ceremony without benefit.
zeroize = { workspace = true }

# Sprint 18 Phase E1: local NVIDIA driver discovery and NVD CVE
# lookup at launcher startup. `nvml-wrapper` dynamically loads
# `libnvidia-ml` / `nvml.dll` at runtime via `libloading`, so this
# dependency is safe to add on every target — machines without an
# NVIDIA driver simply trigger a benign "init failed" that the
# driver_check module turns into a fail-open empty report.
nvml-wrapper = { workspace = true }
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Unix-only: used by the graceful SIGTERM shutdown path in
# `main.rs`. Kept out of the Windows target so the dependency
# doesn't balloon the Win32 build.
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.12"
url = { workspace = true }
