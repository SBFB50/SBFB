[package]
name = "nexus-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Minimal SBFB launcher — spawns daemon, opens browser, waits for Ctrl+C."

[[bin]]
name = "nexus-launcher"
path = "src/main.rs"

[dependencies]
open = "5"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Sprint 16 Phase A (D1): bearer token + auth HTTP server.
# Reuses nexus-shell-daemon-core::auth for the token generation
# and the loopback host/origin predicates so the launcher and
# daemon share exactly one validation surface.
nexus-shell-daemon-core = { path = "../nexus-shell-daemon-core" }
axum = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# Sprint 18 Phase E1: local NVIDIA driver discovery and NVD CVE
# lookup at launcher startup. `nvml-wrapper` dynamically loads
# `libnvidia-ml` / `nvml.dll` at runtime via `libloading`, so this
# dependency is safe to add on every target — machines without an
# NVIDIA driver simply trigger a benign "init failed" that the
# driver_check module turns into a fail-open empty report.
nvml-wrapper = { workspace = true }
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Unix-only: used by the graceful SIGTERM shutdown path in
# `main.rs`. Kept out of the Windows target so the dependency
# doesn't balloon the Win32 build.
libc = "0.2"

[dev-dependencies]
tempfile = "3.12"
url = { workspace = true }
