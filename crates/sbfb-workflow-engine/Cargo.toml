[package]
name = "sbfb-workflow-engine"
description = "SBFB Workflow Agents — host-neutral durable-execution spike: append-only run journal, transactional outbox, step memoisation and a deterministic echo target."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The pure contract core: `RunEvent.v1` (envelope + upcasting door) moved
# there in Phase I, following the cadence of the other filled identities.
# Intra-workspace path dependency — no new external lock node.
sbfb-workflow-core = { path = "../sbfb-workflow-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# JCS (RFC 8785) canonicalisation feeds every digest in this crate. Plain
# `serde_json::to_vec` is NOT usable here: the `preserve_order` feature is
# enabled elsewhere in the workspace graph (ollama-rs -> schemars), so a
# digest taken over `serde_json` bytes could differ between a `-p` build and
# a `--workspace` build. JCS sorts object members at serialization time and
# is graph-independent.
serde_jcs = { workspace = true }
blake3 = { workspace = true }
# Embedded SQLite is the run journal. Already a workspace dependency
# (coordinator DB), so this crate adds no new lock node beyond itself.
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
thiserror = { workspace = true }

# Sprint 83 Phase K (Unix): std has `process_group(0)` but NO `killpg` —
# killing the descendant tree of a cancelled/timed-out effect needs
# `libc::kill(-pgid, SIGKILL)` (plus the Linux-only PR_SET_PDEATHSIG
# backstop). Already resolved in the lock (0.2 line, pulled via the daemon
# and others), so this crate adds no new lock node — the rusqlite
# precedent above.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Sprint 83 Phase K (Windows): kill-on-close Job Objects are the only
# race-free way to guarantee "descendants cleaned up, Windows included"
# (K.4) — `taskkill /T` and PID-walks are enum-then-kill races. Same crate,
# same version and near the same feature list as the daemon's
# `local_worker.rs` job module (the in-tree SOTA this lifts), plus
# ToolHelp for the CREATE_SUSPENDED → assign → resume hardening that
# closes the assign-after-spawn window the daemon documents. No new lock
# node.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    # CreateJobObjectW's SECURITY_ATTRIBUTES parameter lives under
    # Win32_Security — required even though `None` is always passed.
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
] }

[features]
# Fault injection and the degraded constructors that make each guarantee
# falsifiable. OFF by default: a normal build of this crate cannot reach the
# switches that turn a guarantee off. The suite lives in `tests/`, i.e. a
# separate crate, so `#[cfg(test)]` cannot gate them — the self dev-dependency
# below turns the feature on for the test build only, and does NOT add a lock
# node.
spike-faults = []

[dev-dependencies]
tempfile = { workspace = true }
sbfb-workflow-engine = { path = ".", features = ["spike-faults"] }
