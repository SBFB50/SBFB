[package]
name = "nexus-worker-core"
description = "SBFB nexus-worker headless engine — UI-free library used by the nexus-worker binary and any alternative frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "nexus_worker_core"
path = "src/lib.rs"

[features]
# Default stays cmake-free : any developer can `cargo build` on a
# fresh machine (no llama.cpp, no CUDA toolkit, no NASM). The
# Ollama HTTP backend is always compiled ; operators opt into the
# in-process llama.cpp runtime via --features llm_llama_cpp.
#
# Production deployments are expected to build with
# `llm_llama_cpp` enabled and set `[llm] backend = "llama_cpp"`
# in worker.toml — the default `[llm] backend = "ollama"` stays
# compatible with the vanilla build.
default = []
llm_llama_cpp = ["dep:llama-cpp-2", "dep:llguidance"]
# GPU acceleration features for the llama.cpp backend. Cascade
# the base `llm_llama_cpp` so an operator who picks `--features
# llm_llama_cpp_cuda` automatically pulls the required Rust-side
# wiring without having to list both.
llm_llama_cpp_cuda = ["llm_llama_cpp", "llama-cpp-2/cuda"]
llm_llama_cpp_metal = ["llm_llama_cpp", "llama-cpp-2/metal"]
llm_llama_cpp_vulkan = ["llm_llama_cpp", "llama-cpp-2/vulkan"]

[dependencies]
# The worker engine is built on top of the SBFB core wrapper for
# iroh. Every state change in the engine eventually reads or writes
# something through this crate — docs for task/result entries,
# gossip for curator lists, blobs for fetch-by-ticket, etc.
nexus-core-rs = { path = "../nexus-core-rs" }

# Async runtime. The engine's public API is async throughout so
# the binary (and any alternative frontend) can spin it up on a
# tokio runtime of its choice.
tokio = { workspace = true }

# Serialization used by the config file, the allowlist schema and
# any cached state on disk.
serde = { workspace = true }
serde_json = { workspace = true }
# Invite payloads sign their canonical bytes via `nexus_core_rs::canonical`
# (RFC 8785 JCS). The crate itself is pulled in transitively through
# nexus-core-rs, so we don't declare serde_jcs as a direct dep here.

# W3: layered config loading (defaults + TOML + env vars) and
# cross-platform application directory resolution. `toml` does
# the write side (config-rs is read-only).
config = { workspace = true }
directories = { workspace = true }
toml = { workspace = true }

# Used for hex-encoding the Ed25519 public key in the `register`
# CLI output so users can paste it into a coordinator ACL.
hex = { workspace = true }

# W4: NVIDIA GPU monitoring. nvml-wrapper loads libnvidia-ml.so
# (or nvml.dll on Windows) via libloading at runtime, so the
# crate can be unconditionally linked and falls back gracefully
# to the NoopBackend on systems without an NVIDIA driver.
nvml-wrapper = { workspace = true }

# W5: Ollama HTTP client. The healthcheck path uses
# `list_local_models()` per Context7 `pepperoni21/ollama-rs`
# docs; the generate path calls `ollama.generate(GenerationRequest)`.
ollama-rs = { workspace = true }

# W5: URL parsing for the Ollama endpoint validation.
url = { workspace = true }

# W5/W9: async traits for the OllamaClient abstraction and the
# engine adapters.
async-trait = { workspace = true }

# W7: embedded SQLite for the per-worker project allowlist.
# `bundled` feature links sqlite3 statically so the binary has
# zero system dependencies (matches the "single-file download"
# UX goal). `rusqlite_migration` gives versioned schema
# migrations on top.
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }

# W8: base32 encoding for the `nx1...` invite tokens. The
# canonical invite wire format is `nx1` + BASE32_NOPAD of the
# JSON-encoded Invite; Base32 is chosen for paste-friendliness
# (case-insensitive, no special characters that get stripped
# by chat clients).
data-encoding = { workspace = true }

# Observability — the headless engine logs everything through
# tracing. The binary configures the subscriber; this crate only
# emits events so it stays agnostic to how they get consumed
# (stdout, file, TUI widget, OTEL, ...).
tracing = { workspace = true }

# Error handling.
anyhow = { workspace = true }
thiserror = { workspace = true }

# Sprint 5 Phase A: RFC 3339 timestamps in the worker state
# snapshot that the shell polls via the coordinator proxy.
time = { workspace = true }

# Sprint 16 Phase C: file watcher that reloads ~/.sbfb/consent.json
# when the shell edits it via the coordinator `POST /consent/set`
# endpoint, so the worker picks up level / caps / whitelist
# changes without a restart.
notify = { workspace = true }

# Sprint 16 Phase C: timezone-aware local midnight for the
# per-worker daily usage reset. See workspace Cargo.toml for the
# rationale on why we pick chrono over `time` for this one case.
chrono = { workspace = true }

# Sprint 20 Phase D: schemars derive on `TaskResponse` in
# nexus-core-rs + Ollama format bridging. Re-declared here so the
# worker crate's llm/schema_bridge.rs can import `JsonSchema` and
# `JsonStructure` without reaching through `nexus-core-rs` re-exports.
schemars = { workspace = true }

# Sprint 20 Phase D: in-process llama.cpp runtime (feature-gated).
# Optional workspace dep — only pulled when `llm_llama_cpp` is on,
# keeping the vanilla `cargo build` cmake-free. CUDA / Metal /
# Vulkan feature cascades defined above.
llama-cpp-2 = { workspace = true, optional = true }

# Sprint 20 Phase D: constrained decoding engine bridged Rust-side
# into the llama.cpp sampler via llm/llama_cpp.rs. JSON Schema /
# Lark / regex / GBNF in one crate, ~50 µs mask compute per token.
# Optional-workspace just like `llama-cpp-2` above.
llguidance = { workspace = true, optional = true }

# Deliberately excluded: clap, ratatui, crossterm, dialoguer.
# This crate is UI-free by design (see the 2026-04-10 Sprint 3
# headless-first decision in the plan). Anything user-facing lives
# in the nexus-worker binary crate.

[dev-dependencies]
# Used by config::tests to produce isolated per-test directories
# so that the save/load/env tests do not interfere with any real
# worker.toml on the developer's machine.
tempfile = "3.12"
