[package]
name = "sbfb-factory"
description = "SBFB app scaffolding tool — create and validate SBFB projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
sbfb-manifest = { path = "../sbfb-manifest" }
nexus-core-rs = { path = "../nexus-core-rs" }
blake3 = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
walkdir = { workspace = true }
dunce = { workspace = true }
zip = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
portable-pty = "0.9.0"
# Sprint 72 Phase C (D2): the Ollama execution target streams tokens
# via `ollama-rs` `generate_stream` (feature `stream`). Inherits the
# workspace pin `0.3.4` so the worker and the Factory share a single
# `ollama-rs` version (no cross-crate divergence — D2 rationale).
ollama-rs = { workspace = true, features = ["stream"] }

[dev-dependencies]
tempfile = { workspace = true }
# P2-A-1 review P1 (S73 Phase B): serialize env-mutating unit tests under
# plain `cargo test` (shared process); a no-op cost under nextest.
serial_test = { workspace = true }
