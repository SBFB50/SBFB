<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{name}}</title>
  <script src="sbfb-bridge.js"></script>
</head>
<body>
  <h1>{{name}}</h1>
  <p>Bienvenue dans votre app SBFB.</p>
  <div id="status"></div>
  <script>
    var bridge = new SBFBBridge();
    bridge.getNodeStatus().then(function(status) {
      document.getElementById("status").textContent =
        "Connecté — " + (status.peers || 0) + " pairs";
    }).catch(function() {
      document.getElementById("status").textContent = "Mode hors-ligne";
    });
  </script>
</body>
</html>
