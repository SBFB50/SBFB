<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{name}}</title>
  <script src="sbfb-bridge.js"></script>
</head>
<body>
  <h1>{{name}}</h1>
  <div id="banner"></div>
  <h2>Code Python</h2>
  <pre id="code">print("Bonjour depuis {{name}}")</pre>
  <div id="output"></div>
  <script>
    // EXPERIMENTAL — Pyodide ne tourne PAS encore dans le sandbox SBFB actuel.
    // La CSP des apps (connect-src 'none' + origine opaque de l'iframe) bloque
    // le fetch / WebAssembly.instantiateStreaming que Pyodide utilise pour
    // charger son runtime, et aucun CDN n'est joignable. Ce gabarit est un point
    // de depart pour le futur mode d'hebergement etendu (apps verifiees), qui
    // vendorisera le runtime Pyodide same-origin sous une CSP relachee.
    // Voir README.md.
    var banner = document.getElementById("banner");
    if (typeof loadPyodide === "undefined") {
      banner.textContent =
        "Runtime Python (Pyodide) indisponible dans le sandbox actuel — " +
        "necessite le mode d'hebergement etendu (a venir). Voir README.md.";
    } else {
      // Quand le runtime Pyodide sera disponible same-origin :
      //   loadPyodide().then(function (py) {
      //     var src = document.getElementById("code").textContent;
      //     document.getElementById("output").textContent = py.runPython(src);
      //   });
      banner.textContent = "Pyodide detecte — branchez l'execution (voir le code).";
    }
  </script>
</body>
</html>
