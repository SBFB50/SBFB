[package]
name = "nexus-shell-daemon"
description = "SBFB nexus-shell-daemon: long-lived P2P process backing the React shell's Browse / Curators pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "nexus-shell-daemon"
path = "src/main.rs"

[dependencies]
# The headless engine lives in nexus-shell-daemon-core. This
# binary is a thin CLI + HTTP wrapper around it, mirroring the
# Sprint 3 worker split. See the Sprint 7 Phase A plan §4.1 for
# the split rationale.
nexus-shell-daemon-core = { path = "../nexus-shell-daemon-core" }
nexus-events-core = { path = "../nexus-events-core" }
nexus-trace-core = { path = "../nexus-trace-core" }

# Direct dependency on nexus-core-rs so the runtime can call
# `create_node()` at boot. Phase A only uses `create_node` and
# `Node::shutdown`; Phase C will reach into `Node::gossip()` and
# `Node::blobs_store()` for the curator subscribe pipeline.
nexus-core-rs = { path = "../nexus-core-rs" }
nexus-coordinator-rs = { path = "../nexus-coordinator-rs" }
nexus-worker-core = { path = "../nexus-worker-core" }
sbfb-manifest = { path = "../sbfb-manifest" }

tokio = { workspace = true }
futures-lite = "2.3"

# clap 4.5 derive CLI parser.
clap = { workspace = true }

# HTTP server layer. axum 0.7 is pinned at the workspace level —
# see the workspace Cargo.toml for the R2 risk notes on 0.8.
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Rotating file appender + non-blocking writer, identical to the
# nexus-worker logging stack. The daemon writes `daemon.log` with
# the date rotated daily.
tracing-appender = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization for HTTP response bodies and for reading
# running.json through the core crate.
serde = { workspace = true }
serde_json = { workspace = true }

# Hex-encode / decode helpers in case the `status` subcommand
# ever needs to show a node_id in short form. Small, already in
# the workspace, so no tree growth. Sprint 20 Phase A extends the
# usage to parsing the SBFB_IDENTITY_SECRET_HEX env var the
# launcher hands to the daemon child at `sbfb unlock` time.
hex = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

# Sprint 20 Phase A : zero the hex-encoded identity secret after
# parsing it out of the env var (see `runtime::read_optional_
# identity_env`). The workspace already pulls zeroize as a direct
# dep in nexus-core-rs; declaring it here keeps the runtime
# crate's imports explicit.
zeroize = { workspace = true }

# Sprint 12 Phase A: BlobTicket minting in the publish handler.
iroh-blobs = { workspace = true }

# Sprint 18 Phase E2: the canary publish handler implements the
# core crate's `CanaryBroadcaster` trait on top of a live iroh
# gossip `TopicHandle`, so it needs the `async_trait` attribute
# macro to match the trait's declared shape.
async-trait = { workspace = true }

# Sprint 16 Phase B: hyper / hyper-util power the UDS (Unix) and
# Named Pipe (Windows) accept loops, both of which sit beside
# the TCP listener served by `axum::serve`. The Router stays the
# source of truth — `TowerToHyperService` bridges it into
# `auto::Builder::serve_connection` for each accepted stream.
hyper = { workspace = true }
hyper-util = { workspace = true }

# Sprint 22 Phase C: the daemon exposes a loopback proxy at
# `/api/contributor/verify/...` that forwards to the coordinator's
# matching endpoint. reqwest is the same HTTP client the coordinator
# uses for its own outbound calls (httpx on the Python side) — the
# workspace pin is `0.12` default-features-off with the minimal
# `rustls-tls-native-roots` feature needed to talk to a loopback
# HTTPS coord in a future sprint (pre-launch the coord is HTTP so
# the client strictly goes over plain TCP).
reqwest = { workspace = true }

# Sprint 42 Phase B: verified deploy from source — zip creation
# and temporary clone directory.
zip = { workspace = true }
tempfile = "3.12"

# Sprint 30 Phase C: FROST DKG ceremony CLI handler constructs
# CanarySigned with date arithmetic (today_utc + CANARY_VALIDITY_DAYS).
time = { workspace = true }

# Sprint 16 Phase B (Unix): SO_PEERCRED + getsockopt for the UDS
# accept loop's peer-uid check. The launcher already pulls libc
# on Unix for SIGTERM signalling — declared explicitly here so
# the daemon binary owns the unsafe call inline.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Sprint 16 Phase B (Windows): the windows crate provides the
# Win32 SECURITY_DESCRIPTOR + DACL bindings used by
# `named_pipe_server::secure_pipe_attributes` to construct a
# SECURITY_ATTRIBUTES allowing only the current user SID. The
# features list is intentionally narrow — pulling the whole
# Win32 namespace would balloon link time on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
nexus-coordinator-rs = { path = "../nexus-coordinator-rs", features = ["test-support"] }
# Sprint 12 Phase A: zip archive creation for blob-serve tests.
zip = { workspace = true }
# End-to-end tests spawn the real compiled binary with an
# isolated NEXUS_GRID_ROOT fixture directory, the same harness
# the nexus-worker tests use.
tempfile = "3.12"

# Unix-only tests signal the running daemon with SIGINT to
# prove the start handler's ctrl+c wiring works end-to-end.
# Mirrors the worker's `tests/e2e.rs` guard.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
