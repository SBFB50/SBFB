[package]
name = "sbfb-workflow-core"
description = "SBFB Workflow Agents — pure contract core: versioned schema identities, canonicalisation and static validation. No Tokio, no network, no database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
# BLAKE3 content digests bind FactoryProcessProfile.v1 (Phase D) to its sources.
# Already a workspace dependency resolved for the crypto crates, so pulling it in
# here adds no new lock node. Pure hashing — no I/O, keeps the crate charter
# (no Tokio, no network, no database) intact.
blake3 = { workspace = true }
# JCS RFC 8785 canonicalisation for the signed pack (Phase F). Already a
# workspace dependency of the crypto crates, so it adds no new lock node. Pure
# serialisation — no I/O, keeps the crate charter intact.
serde_jcs = { workspace = true }
# Ed25519 verification of a pack signature (Phase F). Verification is pure
# arithmetic on bytes the caller supplies: no key store, no filesystem, no
# network. Already a workspace dependency, so no new lock node.
ed25519-dalek = { workspace = true }

[dev-dependencies]
