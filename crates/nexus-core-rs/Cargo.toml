[package]
name = "nexus-core-rs"
description = "SBFB nexus-core: iroh wrapper for distributed P2P compute (Rust library)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "nexus_core_rs"
# Standard `rlib` library consumed by nexus-core-py (via path dep) and
# by nexus-worker (also via path dep). When Sprint 2 adds PyO3 bindings
# the library stays a regular rlib — only nexus-core-py is cdylib.

[dependencies]
iroh = { workspace = true }
iroh-docs = { workspace = true }
iroh-gossip = { workspace = true }
iroh-blobs = { workspace = true }

tokio = { workspace = true }
futures-lite = "2.3"
bytes = "1.7"
serde = { workspace = true }
serde_json = { workspace = true }
serde-big-array = { workspace = true }
serde_jcs = { workspace = true }

ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

# Sprint 19 Phase A : pkarr_resolver takes a url::Url at construction
# time (matching iroh 0.98 PkarrRelayClient::new signature). Already
# a transitive dep of iroh ; made direct so the pkarr_resolver module
# can import the type without a second-level re-export dance. Pinned
# through the workspace like every other foundational dep.
url = { workspace = true }

# Sprint 19 Phase B : relay_pow_policy.rs reads a TOML file
# (~/.sbfb/relay_pow_policy.toml) mapping topic ids to difficulty
# overrides. Already a workspace dep used by the worker allowlist
# and the coordinator config loader.
toml = { workspace = true }

# Sprint 19 Phase B : relay_pow_policy.rs decodes 64-char topic id
# hex keys at load time. hex is already a workspace dep used by
# the worker (worker.rs) and the daemon (auth.rs); pulling it in
# direct here avoids a transitive-re-export dance.
hex = { workspace = true }

# Sprint 19 Phase B : gossip.rs PowVerifyCache uses DashMap for
# the concurrent (publisher_pubkey, topic) → valid_until table
# that amortises PoW verification across broadcasts in a session.
dashmap = { workspace = true }

# Sprint 19 Phase B : receiver-side cache TTL expiry needs a
# monotonic clock source that survives system time adjustments.
# tokio::time::Instant is the right primitive but the tests need
# to manipulate "now" deterministically — we rely on
# std::time::Instant for the cache itself (monotonic) and surface
# a tokio sleep only inside the expiry task. The `time` workspace
# dep is not needed here — chrono::DateTime only appears in the
# canary payload, which is a separate domain.

# Sprint 19 Phase C : tls_pinning.rs extracts the SubjectPublicKeyInfo
# from DER-encoded certs (RFC 5280 §4.1.2.7) and SHA-256-hashes it
# per RFC 7469 §2.4. x509-parser is zero-copy and fuzzed ; we keep
# it here rather than deep-nested to avoid a transitive-reexport
# dance from rustls-pki-types.
x509-parser = { workspace = true }

# Sprint 19 Phase C : base64url no-padding encoding for SPKI pin
# hashes in ~/.sbfb/relay-pins.json and for the openssl pipeline
# documented in docs/release/RELAY_PIN_BOOTSTRAP.md.
base64 = { workspace = true }

# Sprint 19 Phase C : PinValidator hot-reloads the pins file via a
# notify file-watcher (pattern reused from TokenRotator S18 Phase D
# and ConsentWatcher S16 Phase C). Already a workspace dep.
notify = { workspace = true }

# Sprint 19 Phase C : RFC3339 parsing of `added_at` / `expires_at`
# fields in the pin store. chrono is preferred over the `time`
# crate here for consistency with the warrant-canary timestamp
# handling (S18 Phase E2) and to keep a single datetime ecosystem
# inside nexus-core-rs.
chrono = { workspace = true }

# Sprint 20 Phase A : encryption at rest for the daemon's Ed25519
# identity keypair. See the workspace Cargo.toml comments for the
# rationale of each dep (Argon2id params, RustCrypto aes-gcm over
# aws-lc-rs due to Windows NASM build constraints pre-launch,
# secrecy SecretBox wrapping, OS keyring double-layer defense,
# zeroize RAII wipe).
argon2 = { workspace = true }
aes-gcm = { workspace = true }
secrecy = { workspace = true }
keyring = { workspace = true }
zeroize = { workspace = true }

# Sprint 20 Phase D : schemas/task_response.rs derives JsonSchema
# on the Rust `TaskResponse` struct so the wire schema is generated
# from the type (single source of truth). The generated schema is
# consumed by both worker backends : `ollama-rs` wires it into
# `FormatType::StructuredJson(Box<JsonStructure>)` and the
# `llama-cpp-2` backend feeds the same `serde_json::Value` to
# `llguidance::TopLevelGrammar::from_json_schema`. Sprint 72 Phase C
# (D2) bumped the workspace pin to schemars 1.2 to match ollama-rs
# 0.3.4 (`JsonStructure::new::<T>()` binds schemars 1.2's `JsonSchema`).
schemars = { workspace = true }

# Sprint 24 Phase E : DNS-based DHT fallback (DoH + DoT) via
# hickory-resolver. The DnsFallbackResolver queries encrypted DNS
# when pkarr relays are unreachable. See `src/dns_fallback.rs`.
hickory-resolver = { workspace = true }

# Sprint 31 Phase C : Tor transport phase 1 (config + fallback).
# Sprint 32 Phase B : dep activated (rusqlite 0.36 unblocked resolution).
arti-client = { workspace = true, optional = true }

[features]
tor = ["dep:arti-client"]

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "pow"
harness = false

[[bench]]
name = "keystore"
harness = false
