[package]
name = "nexus-core-rs"
description = "SBFB nexus-core: iroh wrapper for distributed P2P compute (Rust library)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "nexus_core_rs"
# Standard `rlib` library consumed by nexus-core-py (via path dep) and
# by nexus-worker (also via path dep). When Sprint 2 adds PyO3 bindings
# the library stays a regular rlib — only nexus-core-py is cdylib.

[dependencies]
iroh = { workspace = true }
iroh-docs = { workspace = true }
iroh-gossip = { workspace = true }
iroh-blobs = { workspace = true }

tokio = { workspace = true }
futures-lite = "2.3"
bytes = "1.7"
serde = { workspace = true }
serde_json = { workspace = true }
serde-big-array = { workspace = true }
serde_jcs = { workspace = true }

ed25519-dalek = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

# Sprint 19 Phase A : pkarr_resolver takes a url::Url at construction
# time (matching iroh 0.97 PkarrRelayClient::new signature). Already
# a transitive dep of iroh ; made direct so the pkarr_resolver module
# can import the type without a second-level re-export dance. Pinned
# through the workspace like every other foundational dep.
url = { workspace = true }

# Sprint 19 Phase B : relay_pow_policy.rs reads a TOML file
# (~/.sbfb/relay_pow_policy.toml) mapping topic ids to difficulty
# overrides. Already a workspace dep used by the worker allowlist
# and the coordinator config loader.
toml = { workspace = true }

# Sprint 19 Phase B : relay_pow_policy.rs decodes 64-char topic id
# hex keys at load time. hex is already a workspace dep used by
# the worker (worker.rs) and the daemon (auth.rs); pulling it in
# direct here avoids a transitive-re-export dance.
hex = { workspace = true }

# Sprint 19 Phase B : gossip.rs PowVerifyCache uses DashMap for
# the concurrent (publisher_pubkey, topic) → valid_until table
# that amortises PoW verification across broadcasts in a session.
dashmap = { workspace = true }

# Sprint 19 Phase B : receiver-side cache TTL expiry needs a
# monotonic clock source that survives system time adjustments.
# tokio::time::Instant is the right primitive but the tests need
# to manipulate "now" deterministically — we rely on
# std::time::Instant for the cache itself (monotonic) and surface
# a tokio sleep only inside the expiry task. The `time` workspace
# dep is not needed here — chrono::DateTime only appears in the
# canary payload, which is a separate domain.

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3.13"
criterion = { workspace = true }

[[bench]]
name = "pow"
harness = false
