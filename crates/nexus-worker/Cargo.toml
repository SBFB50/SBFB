[package]
name = "nexus-worker"
description = "SBFB nexus-worker: single-binary GPU contributor for the P2P compute network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "nexus-worker"
path = "src/main.rs"

[dependencies]
# The headless engine lives in nexus-worker-core. This binary is a
# thin CLI + TUI wrapper around it. See the 2026-04-10 Sprint 3
# architecture decision in the SBFB plan for the split rationale.
nexus-worker-core = { path = "../nexus-worker-core" }

# We still depend on nexus-core-rs directly so the CLI stub (and
# later the `stats` / `browse` commands) can reach the underlying
# iroh wrapper without going through the engine loop.
nexus-core-rs = { path = "../nexus-core-rs" }

tokio = { workspace = true }

# W1: clap 4.5 derive CLI parser.
clap = { workspace = true }

# W10: ratatui + crossterm land only when the TUI layer arrives.
# Listed here so the binary can unconditionally compile the TUI
# path once it exists.
ratatui = { workspace = true }
crossterm = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# W11: rotating file appender + non-blocking writer. The
# non-blocking wrapper ships log lines through a background
# thread so the engine loop never blocks on disk I/O.
tracing-appender = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

# W3: hex-encode the Ed25519 public key in `register` output so
# users can copy-paste it into a coordinator allowlist.
hex = { workspace = true }

[dev-dependencies]
# W12: end-to-end tests spawn the compiled binary with an
# isolated --config path under a tempfile-managed fixture.
tempfile = "3.12"
# W12 unix-only test: SIGINT the running worker to prove
# the start handler's ctrl-c hook works end-to-end.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
