[workspace]
resolver = "2"
members = [
    "crates/nexus-core-rs",
    "crates/nexus-core-py",
    "crates/nexus-worker-core",
    "crates/nexus-worker",
    "crates/nexus-shell-daemon-core",
    "crates/nexus-shell-daemon",
    "crates/nexus-launcher",
    "crates/nexus-events-core",
    "crates/nexus-executor",
    "crates/nexus-trace-core",
    "crates/nexus-test-harness",
    "crates/nexus-coordinator-rs",
    "tools/png-to-icns",
]

# Shared package metadata. Individual crates override name/description.
[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.78"
license = "AGPL-3.0-or-later"
authors = ["FlowUP"]
repository = "https://github.com/SBFB50/SBFB"
readme = "README.md"

# Shared dependency versions. Crates inherit with
# `iroh = { workspace = true }` etc. so version bumps live in one place.
#
# iroh stack: upgraded to the 0.98.x line (published 2026-04-17, Sprint 32
# Phase A). iroh-blobs uses independent versioning and is at 0.100.x for
# this release train. Day 0 #3 (iroh 0.97 pin) formally lifted Sprint 32.
# LT-6 trigger resolved.
[workspace.dependencies]
iroh = "0.98"
iroh-docs = "0.98"
iroh-gossip = "0.98"
iroh-blobs = "0.100"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5"
# RFC 8785 JSON Canonicalization Scheme. The SBFB signing layer uses
# this as the single source of canonical bytes on the Rust side; the
# Python coordinator side uses the `jcs` PyPI package (same RFC, same
# byte output), so a Task/Result/Claim signed by the coordinator and
# verified by the worker is byte-identical across the FFI boundary.
serde_jcs = "0.2"

# Crypto (Ed25519 signatures, BLAKE3 content hashes, SHA256 Hashcash PoW)
ed25519-dalek = "2.1"
blake3 = "1.5"
rand = "0.8"
# Sprint 19 Phase B : SHA256 backing the Hashcash PoW primitive
# (crates/nexus-core-rs/src/pow.rs). Hashcash historically targets
# SHA256 — Bitcoin, Tor rend-point PoW 2023, Lightning invoice PoW
# all use it, so external auditors can replay the proof computation
# without being confused by a non-standard hash. BLAKE3 was
# considered (already a workspace dep, 3-5x faster on modern CPUs)
# but the standards-compatibility argument for long-term audit
# clarity (Cure53/ToB S29, VALIDATED_BLUEPRINT couche 3) wins.
# `sha2` is the canonical RustCrypto SHA256 crate, unchanged API
# since 2017, zero transitive churn.
sha2 = "0.10"
hmac = "0.12"

# Error handling and observability
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenTelemetry 0.31 — backend-agnostic tracing infrastructure.
# Sprint 29 Phase D (D3 PLAN-ADAPT from roadmap 0.27): pinned to
# 0.31 (latest stable Sept 2025). Key 0.28+ migrations already
# landed: SdkTracerProvider replaces TracerProvider::builder(),
# BatchSpanProcessor uses its own background thread (no async
# runtime), attribute renames (code.filepath → code.file.path).
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["trace"] }

# Async primitives used by the worker engine (W5 Ollama client
# retry logic and W9 state-machine transitions).
async-trait = "0.1"
futures = "0.3"

# Used by nexus-worker-core::ollama to parse and validate the
# endpoint URL at constructor time rather than on the first
# request. url is already a transitive dep of reqwest/iroh so
# this costs nothing at the binary level.
url = "2.5"

# PyO3 — Python bindings for nexus-core-py.
# Plan originally pinned pyo3 0.22 + pyo3-asyncio 0.21, but the
# ecosystem moved on: pyo3 is at 0.28 and the old pyo3-asyncio crate
# was rolled into the PyO3 org as pyo3-async-runtimes (same author,
# same purpose, now maintained by PyO3 itself).
pyo3 = { version = "0.28", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }

# Worker-specific deps
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
ollama-rs = "0.2"
nvml-wrapper = "0.12.1"

# W3: layered config (defaults + TOML file + env vars) and
# cross-platform OS directory resolution. `config` reads config
# sources but does not write — `toml` handles serialization back
# to disk via serde.
config = "0.14"
directories = "5.0"
toml = "0.8"

# W7: embedded SQLite for the project allowlist. `rusqlite` is
# the canonical binding; `rusqlite_migration` gives schema
# migrations on top.
rusqlite = { version = "0.36", features = ["bundled"] }
rusqlite_migration = "2.2"

# W11: rotating file appender next to tracing-subscriber.
tracing-appender = "0.2"

# String similarity for OutputFilter prompt echo detection (EED).
strsim = "0.11"

# Hex / base32 for keypair display and invite token encoding.
hex = "0.4"
data-encoding = "2.6"

# Sprint 5: ISO-8601 / RFC 3339 timestamps for the worker state
# snapshot that the shell reads via the coordinator proxy. The
# `time` crate is small, well-maintained, and strictly typed —
# preferred over chrono for new code. `formatting` gives the
# `format_into` machinery; `macros` gives `format_description!`.
time = { version = "0.3", features = ["formatting", "macros"] }

# Sprint 7 Phase A: nexus-shell-daemon HTTP layer.
#
# Sprint 21 pre-Phase-A chore: axum bumped 0.7 → 0.8 workspace-
# wide (commit `5e67ce0`) to unblock `tower-governor 0.8` pinning
# axum 0.8. Migration mécanique: 3 routes path syntax `/:param/
# *rest` → `/{param}/{*rest}`, middleware::from_fn signatures
# compat sans modif, Router::merge/nest sans fallback donc sans
# risque panic. Audit gates S16/S17/S19 loopback hardening
# invariants préservés (bearer + Host + Origin + UDS/NP peer
# creds) — rework = syntax only.
#
# tower-http is the CORS middleware source. `cors` is the only
# feature we need — the daemon is loopback-only and does not need
# compression, tracing, rate-limit, or auth layers from tower-http.
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Sprint 16 Phase B: the daemon UDS / Named Pipe accept loops
# wrap connections in hyper directly because axum's `axum::serve`
# only accepts a `TcpListener`. The Router stays the source of
# truth — hyper-util's `TowerToHyperService` bridges it into
# `auto::Builder::serve_connection` for each accepted UDS / NP
# stream.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = [
    "server",
    "server-auto",
    "service",
    "tokio",
] }

# Sprint 7 Phase A: nexus-shell-daemon singleton enforcement
# and concurrent data structures.
#
# sysinfo is used by `nexus_shell_daemon_core::registry` to decide
# whether a `running.json` with a given pid represents a live
# daemon or a stale entry left by a crashed previous run.
#
# dashmap is the concurrent hashmap the Phase C curator runtime
# will store received curator lists in. Declared at workspace level
# now so the Phase A skeleton can already depend on it without a
# workspace churn commit in Phase C.
sysinfo = "0.32"
dashmap = "6"

# Sprint 12 Phase A: zip archive decompression for blob-serve.
# Read-only safe, deflate-only to minimize binary size.
zip = { version = "8.5", default-features = false, features = ["deflate"] }

# Sprint 16 Phase C: file watcher for consent.json reload without
# worker restart. Cross-platform (inotify on Linux, FSEvents on
# macOS, ReadDirectoryChangesW on Windows) via the OS-default
# backend.
notify = "6"

# Sprint 16 Phase C: timezone-aware "local midnight" reset for
# daily GPU usage counters (~/.sbfb/usage.json). The workspace
# comment on `time` (line ~114) prefers `time` for new code, but
# `time::OffsetDateTime::now_local()` is known-racy in multi-
# threaded processes (time-rs/time#293). chrono::Local is
# thread-safe on all supported platforms and is pulled in only
# for this one use case.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Sprint 19 Phase B: criterion for the Hashcash PoW bench
# (`cargo bench --bench pow`). Dev-dependency only — zero prod
# binary impact. `html_reports` disabled because CI runs headless
# and we only assert wall-clock ceilings. The bench wires
# `harness = false` in the target crate so criterion drives its
# own `main`. Upgrading to 0.6+ is a dedicated sprint item (new
# proc-macro API). 0.5 is the stable line as of 2026-04.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

# Sprint 18 Phase E1: NVD API client for the launcher driver CVE
# check. default-features disabled to avoid openssl (reqwest's
# `default-tls` feature pulls native-tls → openssl on Linux); we
# reuse `rustls-tls` which is already pulled transitively by the
# iroh stack, so this adds no new TLS backend to the final
# binary. `json` gives us the `Response::json::<T>()` helper used
# by the NVD parser. ollama-rs has its own direct reqwest
# dependency with different features, so hoisting reqwest here
# does not change the worker-side TLS surface.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Sprint 19 Phase C: TLS cert pinning — SPKI hash extraction from
# DER-encoded certs. `x509-parser` is zero-copy ASN.1, fuzzed, and
# preferred over `spki` (RustCrypto) because it keeps nexus-core-rs
# on a single X.509 ecosystem (`x509-parser` is already transitively
# pulled by reqwest/rustls-pki-types). RFC 5280 §4.1.2.7 SPKI
# DER-encoded bytes → SHA-256 → base64url per RFC 7469 §2.4.
x509-parser = "0.17"

# Sprint 19 Phase C: base64url no-padding encoding for SPKI pin
# hashes. RFC 4648 §5 URL-safe alphabet (+/= → -_ ), no padding
# (RFC 7469 §2.4 pin format is ASCII-friendly without =). The
# general-purpose `URL_SAFE_NO_PAD` engine fits the file format
# `~/.sbfb/relay-pins.json` and matches the openssl pipeline
# documented in docs/release/RELAY_PIN_BOOTSTRAP.md.
base64 = "0.22"

# Sprint 20 Phase A: encryption at rest for the daemon's Ed25519
# identity keypair. Double-layer defense-in-depth :
#   1. Argon2id(PIN + salt) derives a 32-byte KEK. RFC 9106
#      recommends Argon2id for password / PIN input because it is
#      side-channel resistant (unlike Argon2d). Params calibrated
#      at 64 MiB / t=3 / p=1 in `crates/nexus-core-rs/src/keystore.rs`
#      to match a ~3 s/attempt target on modern desktop CPUs
#      (Signal Secure Value Recovery calibration pattern). OWASP
#      Password Storage Cheat Sheet default (19 MiB / t=2) is
#      tuned for passphrase entropy ~40 bits — PIN entropy is
#      <20 bits, so we bump m_cost to raise the GPU-brute-force
#      wall (RTX 5080 crack 6-digit PIN @ 19 MiB <2 s → @ 64 MiB
#      >10 s, asymmetric memory-bandwidth advantage). The crate
#      is the canonical RustCrypto impl, unchanged API since 0.5.0.
argon2 = "0.5"

# Sprint 20 Phase A: AEAD AES-256-GCM wrap of the Ed25519 private
# key. RustCrypto `aes-gcm` (pure Rust, zero system deps) rather
# than `aws-lc-rs` — the latter pulls `aws-lc-sys` which requires
# NASM on Windows, blocking dev-machine builds without an out-of-
# band install. The Sprint 20 kickoff §D1 spec'd aws-lc-rs citing
# the VALIDATED_BLUEPRINT S17 FIPS 140-3 preference, but FIPS is
# explicitly NOT a pre-launch requirement (CLAUDE.md pre-launch
# protocol policy, S17 BLUEPRINT "FIPS track long-term"). The
# algorithm (AES-256-GCM) is byte-identical between the two crates
# — future migration to aws-lc-rs for a FIPS-validated build is a
# one-file swap (the `build_aead_key` / seal / open call sites in
# `crates/nexus-core-rs/src/keystore.rs`) behind a build feature,
# carry-over to the sprint that actually activates FIPS. The
# RustCrypto crate is widely audited (rustsec clean April 2026),
# implements the same RFC 5116 AEAD, and sees active use in
# projects like `age`, `openmls`, and `signal-rs`.
aes-gcm = "0.10"

# Sprint 20 Phase A: hold derived KEK / expose-on-demand wrapper.
# secrecy 0.10 `SecretBox<T>` requires `T: Zeroize` (raw bytes
# arrays implement it automatically via the `zeroize` dep below)
# and zeroes the heap allocation on drop. 0.10 is the current
# stable line as of April 2026 — the 0.8 → 0.10 bump landed in
# December 2025 with a `Box<T>` constructor signature break that
# this crate depends on.
secrecy = "0.10"

# Sprint 20 Phase A: cross-platform OS credential store (Keychain
# on macOS/iOS, Credential Manager on Windows, Secret Service on
# Linux/FreeBSD/OpenBSD). Used as the *second* layer of the double
# -wrap defense: the OS keyring holds an independent wrap of the
# KEK so an attacker who steals only the encrypted blob file
# still faces the Argon2id PIN barrier, and an attacker who reads
# the OS keyring (same-user DPAPI Mimikatz bypass, Sygnia 2024 +
# SpecterOps 2026) still faces the PIN barrier because the blob
# ciphertext is bound to Argon2id(PIN+salt) — not the keyring wrap.
# 3.6 is the stable line as of 2026-04; the 3.0 → 3.x API is
# settled (Entry::new / set_secret / get_secret / delete_credential).
keyring = "3.6"

# Sprint 20 Phase A: RAII zeroize on drop for sensitive buffers
# (PIN bytes, Argon2id output, Ed25519 secret key bytes after
# they leave `SecretBox`). `derive` feature gives the `#[derive
# (Zeroize, ZeroizeOnDrop)]` macros used on the `KeyStoreError`-
# free wrapper types inside `keystore.rs`. The bare `zeroize`
# crate was always a transitive dep of ed25519-dalek / secrecy ;
# hoisting it as a workspace dep makes the intent explicit and
# lets the launcher's interactive PIN prompt zero the input
# buffer without a re-export dance.
zeroize = { version = "1.8", features = ["derive"] }

# Sprint 20 Phase A: `tempfile` already appears as a dev-dep on
# several crates (see `crates/nexus-core-rs/Cargo.toml` below).
# Hoist it to the workspace so the new `keystore_integration.rs`
# test suite and the `unlock.rs` launcher flow share a single
# pinned version. 3.13 is the current stable line.
tempfile = "3.13"

# Sprint 20 Phase D: JSON Schema derive for Rust structs —
# `TaskResponse` uses `#[derive(JsonSchema)]` so the wire schema
# is generated from the Rust type (single source of truth) and
# fed to both `ollama_rs::generation::parameters::JsonStructure`
# and `llguidance::TopLevelGrammar::from_json_schema`. Pinned to
# 0.8.21 to match ollama-rs 0.2.6 transitive constraint — the
# 0.8 → 1.0 upgrade is an ecosystem-wide churn we avoid in a
# security-hardening sprint.
schemars = { version = "0.8.21", features = ["derive"] }

# Sprint 20 Phase D: embedded llama.cpp runtime via the `utilityai`
# Rust binding. Kept as an optional workspace dep so crates opt in
# via feature flag — a vanilla `cargo build` stays cmake-free and
# works on any dev box without CUDA toolkit or NASM. Production
# images enable the feature plus the appropriate GPU backend
# (`cuda`, `metal`, `vulkan`) on top of the `llama_cpp` feature
# in `crates/nexus-worker-core/Cargo.toml`. 0.1.143 is the current
# stable line on crates.io (April 2026) and exposes LlamaBackend,
# LlamaModel, LlamaContext, LlamaBatch, LlamaSampler needed by the
# custom llguidance-driven sampler in `llm/llama_cpp.rs`.
llama-cpp-2 = "0.1.143"

# Sprint 20 Phase D: Microsoft constrained-decoding engine. JSON
# Schema / Lark / regex / GBNF support with ~50µs mask compute on
# 128k tokenizers. Wired Rust-side (custom sampler) rather than via
# the llama.cpp -DLLAMA_LLGUIDANCE=ON cmake flag, so operators do
# not need a custom llama.cpp build — cargo pulls the crate, the
# sampler bridges `Matcher::compute_mask()` to the `LlamaContext`
# logits vector. 1.7 is the current stable line (April 2026);
# context7 `/guidance-ai/llguidance` confirms the `ParserFactory` +
# `TopLevelGrammar` + `Matcher` API shape used in `llm/llama_cpp.rs`.
llguidance = "1.7"

# Sprint 20 Phase E.2: FROST (Flexible Round-Optimised Schnorr
# Threshold) signatures over Ed25519, ZcashFoundation reference
# implementation. RFC 9591 (jan 2025), audited by Trail of Bits in
# 2023. The crate's `aggregate()` output is a 64-byte Ed25519
# signature byte-identical to a standalone RFC 8032 signature, so
# warrant canary verifiers can keep using the existing
# `nexus_core_rs::crypto::verify` path unchanged whether the canary
# was signed by a single `Ed25519CanarySigner` (default) or a
# threshold `FrostCanarySigner` (opt-in K-of-N cross-juridiction
# maintainer federation, scaffolded here, real distribution
# enforcement scheduled Sprint 25-30 per docs/security/HARDENING_
# ROADMAP.md §3 "Warrant canary Niveau 1 enforcement"). 2.1.0 is
# G2 trigger frost-ed25519 3.0.0 (2026-04-23) — upgraded S34 Phase A.
# Signature remains Ed25519 RFC 8032 byte-identical. DKG intermediate
# serialization format gains version+ciphersuite header (non-issue
# under pre-launch protocol policy — zero deployed DKG shares).
# RustSec advisory check: zero active advisories.
frost-ed25519 = "3"

# Sprint 21 Phase A : rate-limit GCRA (Generic Cell Rate
# Algorithm) multi-tier per-(consumer, worker, model). `governor`
# est la seule crate Rust 2026 mature avec GCRA + keyed natif
# (DashMap backend pour cardinalité dynamique). Wrapper
# `RateLimiter` dans `crates/nexus-worker-core/src/rate_limit.rs`
# consommé par l'engine worker pre-task-execution (R1 scope-cut
# worker-engine gate pure Rust, HTTP middleware coord-side
# différé S22+). Scope D1 kickoff §4 figé 2026-04-18 + R1
# arbitrage drift mid-phase 2026-04-19 (cf. `.planning/archive/
# v1.2/sprint21_phase_A_pivot_proposal.md` frontmatter
# `post_bump_drift_R1`).
#
# Version 0.10.2 = dernière stable crates.io (vérifié context7
# `/boinkor-net/governor` + WebSearch 2026-04-18). Rejected
# alternatives documentées kickoff §D1 Rejetés (ratelimit_meter
# archived, leaky-bucket non-keyed, tokio-rate-limit 0.8 sans
# GCRA, custom lru + atomic reinvente, global daemon-wide défaite
# §4 fairness). RustSec scan 2026-04-18 : aucun advisory actif
# sur `governor`.
governor = "0.10.2"

# Sprint 21 Phase A : helper `nonzero!(N)` macro requis par
# `governor::Quota::per_second(nonzero!(10u32))` etc. La macro
# construit un `NonZero*` au compile-time avec panic statique si
# la valeur est zéro — strictement nécessaire vu que les
# constructeurs `Quota::*` acceptent uniquement des non-zéro.
nonzero_ext = "0.3"

# Sprint 23 Phase B : safe CUDA bindings for VRAM wipe (cuMemsetD8)
# between tasks — ephemeral worker defense-in-depth against model
# weight extraction by injected task N+1. Feature-gated behind
# `gpu-ephemeral` so the vanilla build stays CUDA-toolkit-free.
# The `driver` feature exposes the low-level cuMemAlloc / cuMemsetD8
# path ; no runtime/nvrtc needed.
cudarc = { version = "0.12", default-features = false, features = ["driver", "cuda-12060"] }

# Sprint 24 Phase E : DNS-based DHT fallback (DoH RFC 8484 + DoT
# RFC 7858). When pkarr relay quorum (Sprint 19) returns AllFailed,
# the browse aggregator falls back to encrypted DNS resolution via
# hickory-resolver (formerly trust-dns-resolver). Mature crate
# (4.4k stars, Apache-2.0), tokio-native async, DoH + DoT + DNSSEC
# support. RustSec scan 2026-04-21 : zero active advisories.
# `dns-over-https-rustls` and `dns-over-rustls` use the rustls TLS
# backend already pulled transitively by the iroh stack — no
# new TLS backend added to the binary.
hickory-resolver = { version = "0.24", features = [
    "dns-over-https-rustls",
    "dns-over-rustls",
] }

# Sprint 31 Phase C : Tor transport phase 1. Config infrastructure,
# feature gate, fallback mechanism delivered. Sprint 32 Phase B :
# rusqlite 0.32→0.36 resolved the libsqlite3-sys conflict — arti-client
# dep activated. tor-dirmgr (transitive) needs rusqlite >=0.36.
arti-client = "0.41"

[profile.release]
# Deterministic release profile — prerequisite for SLSA in-toto
# attestation (Sprint 18 Phase B). Two builds of the same commit
# with the same `SOURCE_DATE_EPOCH` must produce byte-identical
# binaries so users can reproduce the attestation independently.
#
# - `codegen-units = 1` forces single-thread codegen (removes the
#   non-determinism introduced by parallel LLVM units ordering).
# - `lto = "fat"` links the whole program at once; combined with
#   `codegen-units = 1` it also slightly shrinks binary size.
# - `strip = "symbols"` removes symbol table and debug info — both
#   non-reproducible across toolchain versions and unnecessary for
#   production artifacts (debug symbols shipped separately when needed).
# - `debug = false` is the release default but we set it explicitly
#   so future "build with debuginfo" tweaks stay scoped to a custom
#   profile rather than polluting the reproducible one.
# - `panic = "abort"` kept from the original sizing rationale.
opt-level = 3
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
# Faster incremental compile during Sprint 1 learning. Opt-level 1 on
# dependencies keeps them fast to run without the full release cost.
opt-level = 0
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 1
