# SPDX-License-Identifier: AGPL-3.0-or-later
#
# nexus-grid Release — reproducible Rust binaries with SLSA in-toto
# provenance (Sprint 18 Phase B) + PyPI wheels + GitHub Release draft.
#
# Trigger: push tag v* (e.g. v1.0.0) or manual workflow_dispatch.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # required for cosign keyless OIDC
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build ${{ matrix.binary }} (${{ matrix.os-label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-label: linux-x86_64
            shell: bash
          - os: macos-latest
            os-label: macos-arm64
            shell: bash
          - os: windows-latest
            os-label: windows-x86_64
            shell: bash
        binary:
          - nexus-worker
          - nexus-shell-daemon
          - nexus-launcher
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so `git log -1 --format=%ct` in
          # release-attest.sh resolves SOURCE_DATE_EPOCH to the commit
          # timestamp rather than to the checkout time.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Build + attest ${{ matrix.binary }}
        env:
          COSIGN_EXPERIMENTAL: "1"  # keyless OIDC via GitHub Actions
        run: bash scripts/release-attest.sh ${{ matrix.binary }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.os-label }}
          path: |
            dist/${{ matrix.binary }}-*
            dist/${{ matrix.binary }}-*.sha256
            dist/${{ matrix.binary }}-*.intoto.jsonl
            dist/${{ matrix.binary }}-*.intoto.jsonl.sig

  publish-pypi:
    name: Publish PyPI wheels
    runs-on: ubuntu-latest
    needs: [build-binaries]
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheels
        run: |
          uv build packages/nexus-sdk --wheel --out-dir dist/
          uv build packages/nexus-coordinator --wheel --out-dir dist/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv publish dist/*.whl
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  github-release:
    name: Create GitHub Release draft
    runs-on: ubuntu-latest
    needs: [build-binaries, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          files: |
            dist/nexus-worker-*
            dist/nexus-shell-daemon-*
            dist/nexus-launcher-*
