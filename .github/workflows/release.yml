# SPDX-License-Identifier: AGPL-3.0-or-later
#
# nexus-grid Release — reproducible Rust binaries with SLSA in-toto
# provenance (Sprint 18 Phase B) + GitHub Release draft.
#
# Trigger: push tag v* (e.g. v1.0.0) or manual workflow_dispatch.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # required for cosign keyless OIDC
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build ${{ matrix.binary }} (${{ matrix.os-label }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        binary: [nexus-worker, nexus-shell-daemon, nexus-launcher]
        include:
          - os: ubuntu-latest
            os-label: linux-x86_64
            shell: bash
          - os: macos-latest
            os-label: macos-arm64
            shell: bash
          - os: windows-latest
            os-label: windows-x86_64
            shell: bash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so `git log -1 --format=%ct` in
          # release-attest.sh resolves SOURCE_DATE_EPOCH to the commit
          # timestamp rather than to the checkout time.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Build + attest ${{ matrix.binary }}
        env:
          COSIGN_EXPERIMENTAL: "1"  # keyless OIDC via GitHub Actions
        run: bash scripts/release-attest.sh ${{ matrix.binary }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.os-label }}
          path: |
            dist/${{ matrix.binary }}-*
            dist/${{ matrix.binary }}-*.sha256
            dist/${{ matrix.binary }}-*.intoto.jsonl
            dist/${{ matrix.binary }}-*.intoto.jsonl.sig

  # End-user bundles: the launcher looks for `nexus-shell-daemon` and
  # `web/` next to itself, so each OS gets one archive with the binaries
  # under their canonical names plus the built React shell.
  package:
    name: Package end-user bundles
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web shell
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Assemble archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux-x86_64 macos-arm64 windows-x86_64; do
            ext=""; [ "$target" = windows-x86_64 ] && ext=".exe"
            stage="stage/sbfb-${VERSION}-${target}"
            mkdir -p "$stage"
            for b in nexus-launcher nexus-shell-daemon nexus-worker; do
              install -m 0755 "bin/${b}-${target}${ext}" "$stage/${b}${ext}"
            done
            cp -r web/dist "$stage/web"
            cp LICENSE "$stage/"
            (cd stage && zip -qr "../dist/sbfb-${VERSION}-${target}.zip" "sbfb-${VERSION}-${target}")
          done
          (cd dist && sha256sum sbfb-*.zip > SHA256SUMS-bundles.txt)
          ls -la dist

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: dist/

  github-release:
    name: Create GitHub Release draft
    runs-on: ubuntu-latest
    needs: [build-binaries, package]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          files: |
            dist/sbfb-*.zip
            dist/SHA256SUMS-bundles.txt
            dist/nexus-worker-*
            dist/nexus-shell-daemon-*
            dist/nexus-launcher-*
