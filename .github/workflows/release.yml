#
# nexus-grid Release — build binaries + publish PyPI wheels on tag push.
# Trigger: push tag v* (e.g. v1.0.0)

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux x86_64 binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build --release -p nexus-worker -p nexus-shell-daemon
          mkdir -p dist
          cp target/release/nexus-worker dist/nexus-worker-linux-x86_64
          cp target/release/nexus-shell-daemon dist/nexus-shell-daemon-linux-x86_64
          chmod +x dist/*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/

  build-windows:
    name: Build Windows x86_64 binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build --release -p nexus-worker -p nexus-shell-daemon
          mkdir dist
          copy target\release\nexus-worker.exe dist\nexus-worker-windows-x86_64.exe
          copy target\release\nexus-shell-daemon.exe dist\nexus-shell-daemon-windows-x86_64.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/

  publish-pypi:
    name: Publish PyPI wheels
    runs-on: ubuntu-latest
    needs: [build-linux]
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheels
        run: |
          uv build packages/nexus-sdk --wheel --out-dir dist/
          uv build packages/nexus-coordinator --wheel --out-dir dist/

      - name: Publish to PyPI
        run: uv publish dist/*.whl
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, publish-pypi]
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist/

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/nexus-worker-linux-x86_64
            dist/nexus-shell-daemon-linux-x86_64
            dist/nexus-worker-windows-x86_64.exe
            dist/nexus-shell-daemon-windows-x86_64.exe
