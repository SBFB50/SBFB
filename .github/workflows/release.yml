# SPDX-License-Identifier: AGPL-3.0-or-later
#
# nexus-grid Release — reproducible Rust binaries with SLSA in-toto
# provenance (Sprint 18 Phase B) + PyPI wheels + GitHub Release draft.
#
# Trigger: push tag v* (e.g. v1.0.0) or manual workflow_dispatch.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # required for cosign keyless OIDC
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build ${{ matrix.binary }} (${{ matrix.os-label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-label: linux-x86_64
            shell: bash
          - os: macos-latest
            os-label: macos-arm64
            shell: bash
          - os: windows-latest
            os-label: windows-x86_64
            shell: bash
        binary:
          - nexus-worker
          - nexus-shell-daemon
          - nexus-launcher
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required so `git log -1 --format=%ct` in
          # release-attest.sh resolves SOURCE_DATE_EPOCH to the commit
          # timestamp rather than to the checkout time.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Build + attest ${{ matrix.binary }}
        env:
          COSIGN_EXPERIMENTAL: "1"  # keyless OIDC via GitHub Actions
        run: bash scripts/release-attest.sh ${{ matrix.binary }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.os-label }}
          path: |
            dist/${{ matrix.binary }}-*
            dist/${{ matrix.binary }}-*.sha256
            dist/${{ matrix.binary }}-*.intoto.jsonl
            dist/${{ matrix.binary }}-*.intoto.jsonl.sig

  # Sprint 18 audit fix B-1.
  #
  # `release-attest.sh` supports the `nexus-core-py` wheel via the
  # maturin path (script lines 76-87) — `maturin build --release
  # --locked` honours SOURCE_DATE_EPOCH and the script emits the
  # same `.sha256` + `.intoto.jsonl` shape as for native binaries.
  # The original Phase B landing wired `release-attest.sh` into the
  # `build-binaries` matrix for native binaries only, so the wheel
  # shipped via `publish-pypi` had no SLSA provenance attestation,
  # contradicting the `REPRODUCIBLE_BUILDS.md §1` claim that "every
  # binary release" is accompanied by an attestation.
  #
  # This job runs on Linux (the wheel is platform-agnostic Python
  # bytecode + a manylinux native module — we attest the manylinux
  # variant for now and revisit cross-platform wheels in Sprint 20+
  # when the matrix grows). Output gets uploaded as a GitHub
  # artifact alongside the native binaries and downloaded by the
  # `github-release` job for inclusion in the release draft.
  build-wheel-attest:
    name: Build + attest nexus-core-py wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install maturin
        run: pip install --user 'maturin>=1.13,<2'

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Build + attest nexus-core-py wheel
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: bash scripts/release-attest.sh nexus-core-py

      - name: Upload wheel + attestation
        uses: actions/upload-artifact@v4
        with:
          name: nexus-core-py-wheel-attested
          path: |
            dist/nexus_core_py-*.whl
            dist/nexus_core_py-*.whl.sha256
            dist/nexus_core_py-*.whl.intoto.jsonl
            dist/nexus_core_py-*.whl.intoto.jsonl.sig

  publish-pypi:
    name: Publish PyPI wheels
    runs-on: ubuntu-latest
    needs: [build-binaries, build-wheel-attest]
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheels
        run: |
          uv build packages/nexus-sdk --wheel --out-dir dist/
          uv build packages/nexus-coordinator --wheel --out-dir dist/

      - name: Download attested nexus-core-py wheel
        uses: actions/download-artifact@v4
        with:
          name: nexus-core-py-wheel-attested
          path: dist/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        # Skip the `.sha256` / `.intoto.jsonl` companion files that
        # came down with the nexus-core-py wheel : `uv publish`
        # only knows how to hand wheels to PyPI. The attestation
        # files travel separately to the GitHub Release via the
        # `github-release` job below.
        run: uv publish dist/*.whl
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  github-release:
    name: Create GitHub Release draft
    runs-on: ubuntu-latest
    needs: [build-binaries, build-wheel-attest, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create Release
        # Sprint 18 audit fix B-1 : the wheel `nexus_core_py-*.whl`
        # + its `.sha256` + `.intoto.jsonl[.sig]` come from the
        # `build-wheel-attest` job (downloaded just above by the
        # download-artifact step) and are now included in the
        # release draft alongside the native binaries. Verifiers
        # can fetch and re-validate the wheel's SLSA provenance
        # the same way they do for `nexus-launcher` & co.
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          files: |
            dist/nexus-worker-*
            dist/nexus-shell-daemon-*
            dist/nexus-launcher-*
            dist/nexus_core_py-*
