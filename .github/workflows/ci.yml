#
# nexus-grid CI — mirrors scripts/verify.sh on ubuntu-latest.
# Trigger: push to master, pull requests.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Full verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── Rust ──────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: "[1] cargo fmt"
        run: cargo fmt --all --check

      - name: "[2] cargo clippy"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: "[3] cargo test"
        run: cargo test --workspace --locked

      # ── Frontend ──────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: cd web && npm ci

      - name: "[4] tsc"
        run: cd web && npx tsc --noEmit -p tsconfig.app.json

      - name: "[5] eslint"
        run: cd web && npm run lint

      - name: "[6] vitest"
        run: cd web && npm run test:unit

      - name: "[7] coverage"
        run: cd web && npm run test:coverage

      - name: "[8] build"
        run: cd web && npm run build

      - name: "[9] size-limit"
        run: cd web && npm run size

      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps chromium

      - name: "[10] playwright"
        run: cd web && xvfb-run npx playwright test

      - name: "[11] scan-en-strings"
        run: cd web && bash scripts/scan-en-strings.sh

      - name: "[12] npm audit"
        run: cd web && npm audit --audit-level=high || true

      # ── SPDX ─────────────────────────────────────────────
      - name: "[13] SPDX check"
        run: bash scripts/check-spdx.sh
