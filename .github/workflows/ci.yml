#
# nexus-grid CI — mirrors scripts/verify.sh on ubuntu-latest.
# Trigger: push to master, pull requests.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Full verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── Rust ──────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: "[1] cargo fmt"
        run: cargo fmt --all --check

      - name: "[2] cargo clippy"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: "[3] cargo test"
        run: cargo test --workspace --locked

      # ── Frontend ──────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: cd web && npm ci

      - name: "[4] tsc"
        run: cd web && npx tsc --noEmit -p tsconfig.app.json

      - name: "[5] eslint"
        run: cd web && npm run lint

      - name: "[6] vitest"
        run: cd web && npm run test:unit

      - name: "[7] coverage"
        run: cd web && npm run test:coverage

      - name: "[8] build"
        run: cd web && npm run build

      - name: "[9] size-limit"
        run: cd web && npm run size

      # Process-evolution Commit 2: real hermetic Playwright E2E. Replaces
      # the former vacuous "[10] playwright" no-op (config-less, spec-less
      # green removed in Sprint 76 Phase B). Builds the daemon (debug),
      # serves the dist from step [8] via `--web-root`, and drives the real
      # shell in chromium. The @compute flagship spec is env-gated and stays
      # local (needs Ollama + a deployed app); CI runs only the hermetic specs.
      - name: "[10a] build daemon for E2E"
        run: cargo build -p nexus-shell-daemon
      - name: "[10b] install playwright chromium"
        run: cd web && npx playwright install --with-deps chromium
      - name: "[10c] playwright E2E (hermetic)"
        run: cd web && npm run test:e2e
        env:
          SBFB_DAEMON_BIN: ${{ github.workspace }}/target/debug/nexus-shell-daemon
      - name: "[10d] upload playwright report on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: "[11] scan-en-strings"
        run: cd web && bash scripts/scan-en-strings.sh

      - name: "[12] npm audit"
        run: cd web && npm audit --audit-level=high || true

      # ── SPDX ─────────────────────────────────────────────
      - name: "[13] SPDX check"
        run: bash scripts/check-spdx.sh

      # ── sharding docs lint (Sprint 77 Phase M) ───────────
      - name: "[14] sharding docs check"
        run: bash scripts/check-sharding-docs.sh
