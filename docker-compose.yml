# ============================================================
# NEXUS -- Docker Compose
# Lance : Neo4j, ChromaDB, Robin
# SearXNG tourne deja sur le host (port 8888), pas inclus ici.
# ============================================================

services:
  # ============================================================
  # Neo4j -- Base de donnees graphe
  # ============================================================
  neo4j:
    image: neo4j:5-community
    container_name: nexus-neo4j
    ports:
      - "7474:7474"   # Interface web Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/nexus2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================
  # ChromaDB -- Base vectorielle
  # ============================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: nexus-chromadb
    ports:
      - "8100:8000"   # Port 8100 en externe (8000 est pris par FastAPI)
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
      IS_PERSISTENT: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v2/heartbeat || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================
  # Robin -- Recherche dark web via Tor (apurvsg/robin)
  # Robin n'a PAS d'API REST. On l'utilise via docker exec CLI.
  # UI Streamlit dispo sur port 8501 (optionnel).
  # ============================================================
  robin:
    image: apurvsg/robin:latest
    container_name: nexus-robin
    ports:
      - "8502:8501"   # UI Streamlit Robin (8501 interne, 8502 externe pour eviter conflit)
    volumes:
      - ./data/robin:/app/investigations
      - ./robin.env:/app/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["ui", "--ui-port", "8501", "--ui-host", "0.0.0.0"]
    restart: unless-stopped
