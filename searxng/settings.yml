use_default_settings: true

server:
  secret_key: "nexus-coldcase-2026"
  bind_address: "0.0.0.0"
  port: 8888

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "fr"
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: false
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: archive is
    engine: archive_is
    shortcut: ai
    disabled: false
  - name: reddit
    engine: reddit
    shortcut: re
    disabled: true

general:
  instance_name: "NEXUS Search"
