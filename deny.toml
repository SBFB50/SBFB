# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Sprint 18 Phase A — supply-chain policy for the Rust workspace.
#
# Enforced in CI by `.github/workflows/supply-chain.yml` (job
# cargo-deny) via EmbarkStudios/cargo-deny-action. Run locally:
#
#     cargo install cargo-deny --locked
#     cargo deny check --workspace
#
# Categories:
#   [advisories] — RUSTSEC vulnerability database
#   [bans]       — crate/version denylist + duplicate detection
#   [licenses]   — SPDX license allowlist
#   [sources]    — registry/git source allowlist
#
# `version = 2` selects the cargo-deny v2 schema (0.15+), which
# replaces the older `vulnerability = "deny"` / `unmaintained` keys
# with a single "deny everything in the database by default, ignore
# by ID" model.

[graph]
# Platforms we build and ship on. iroh, axum, and rusqlite behave
# differently per-target, and cargo-deny needs the list so that the
# dependency graph check covers all 3 OSes our release matrix ships
# (see .github/workflows/release.yml matrix).
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[output]
feature-depth = 1

# --------------------------------------------------------------
# [advisories] — RUSTSEC advisory database
# --------------------------------------------------------------
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# `unmaintained = "workspace"` restricts unmaintained-advisory
# errors to crates declared in our own workspace. Transitive
# unmaintained deps pulled via iroh / ratatui (proc-macro-error
# RUSTSEC-2024-0370, paste RUSTSEC-2024-0436) have no safe
# upgrade and are upstream's problem. Sprint 19+ revisits if
# iroh/ratatui cut a new major that swaps them out.
unmaintained = "workspace"
# Every ignore lands with a `reason` string and tracks
# remediation in HARDENING_ROADMAP front-matter `audited_findings`.
#
# Removed S81 Phase G: RUSTSEC-2026-0097 (rand 0.8 ThreadRng) — the
# advisory no longer matches the lock (cargo-deny reported
# `advisory-not-detected`; rand 0.8.6 is outside the revised advisory
# range). The rand 0.9 upgrade exemption itself is unchanged (cascades
# to ed25519-dalek 2.3 + rand_core 0.9, wants a dedicated sprint).
ignore = [
    # --- hickory-resolver 0.24 root (S81 Phase G, carry S82) ---
    # The four advisories below share one root: the SBFB pin
    # `hickory-resolver = "0.24"` (workspace Cargo.toml), which pulls
    # hickory-proto 0.24.4 + rustls 0.21.12 + rustls-webpki 0.101.7.
    # Fixing them means bumping hickory-resolver 0.24 -> 0.26 (API
    # churn in crates/nexus-core-rs/src/dns_fallback.rs: resolver
    # construction + config types were reworked in 0.25). S81 is
    # "iroh STRICTLY ALONE" (Day-0 #10 anti-bundle, bisectability),
    # so the bump is carried to S82 (HICKORY-024-RUSTSEC, grouped
    # with P2-AUDIT-2-RESIDUEL). Intrinsic classes differ: 0119 and
    # 0104 are DoS-class; 0098/0099 are certificate name-constraint
    # validation laxity (authentication-class, NOT DoS). The SBFB
    # residual is bounded for all four by the same facts: the DNS
    # fallback is opt-in (default `enabled: false`, env
    # SBFB_DNS_FALLBACK_ENABLED), only talks to pinned reputable
    # DoH/DoT resolvers (Cloudflare/Google defaults hardcoded in
    # DnsFallbackConfig::default) whose certs chain normally
    # (name-constrained intermediates are not part of that trust
    # path), and DNS is not a trust anchor here — pkarr records stay
    # Ed25519-verified downstream, so even a spoofed DNS answer
    # cannot forge content.
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.24.4 O(n^2) name compression DoS; reached only via opt-in default-off DNS fallback against pinned reputable TLS-validated resolvers (Cloudflare/Google defaults). Root = hickory-resolver 0.24 pin; bump to 0.26 carried to S82 (HICKORY-024-RUSTSEC), out of S81 iroh-only scope." },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101.7 URI name-constraint laxity; pulled only by hickory-resolver 0.24 dns-over-* features (opt-in default-off fallback). Fix rides the hickory 0.26 bump (rustls 0.23), carried to S82 (HICKORY-024-RUSTSEC)." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101.7 wildcard name-constraint laxity; same bounded opt-in surface and same S82 remediation as RUSTSEC-2026-0098." },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101.7 reachable panic in CRL parsing; SBFB DNS fallback never feeds CRLs, surface opt-in default-off. Same S82 remediation as RUSTSEC-2026-0098." },
    # --- quick-xml via iroh (upstream, S81 Phase G) ---
    # quick-xml 0.39.4 is pulled exclusively by the pinned iroh
    # `=1.0.1` chain (iroh -> netwatch -> netdev -> plist ->
    # quick-xml) for macOS network-interface plist parsing. Both
    # advisories are DoS-class parser issues on attacker-supplied
    # XML; the plist input here is the local OS network
    # configuration, not remote data. No SBFB code parses XML.
    # Remediation depends on an upstream iroh release bumping
    # plist/quick-xml; re-check at every iroh bump (watch trigger
    # in HARDENING_ROADMAP front-matter).
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39.4 quadratic duplicate-attribute check; reached only through iroh=1.0.1 -> netwatch -> plist on local OS config input. Upstream fix required; re-evaluated at each iroh bump." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39.4 unbounded NsReader namespace allocation; same iroh-internal local-input path as RUSTSEC-2026-0194. Upstream fix required; re-evaluated at each iroh bump." },
]

# --------------------------------------------------------------
# [licenses] — SPDX allowlist
# --------------------------------------------------------------
#
# Workspace crates declare `AGPL-3.0-or-later` (root) or
# `AGPL-3.0` (examples/hello-world-app). Both are added to the
# allowlist so cargo-deny treats our own crates as valid. For
# third-party deps the allowlist stays tight: Apache-2.0 / MIT /
# BSD / ISC / Unicode / Zlib / CC0-1.0 / MPL-2.0.
#
# MPL-2.0 is added because multiple common Rust deps ship under
# it (`webpki-roots`, `option-ext`, ...). AGPL for third-party
# deps is rare but harmonizes with our own copyleft posture.
[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8
# Per-crate exceptions landed here with `# reason:` comment.
exceptions = []

# --------------------------------------------------------------
# [bans] — crate/version denylist + duplicate detection
# --------------------------------------------------------------
[bans]
# S81 Phase G convergence gate played: the flip to "deny" is BLOCKED.
# iroh 1.0.1 (and 1.0.2) pin `ed25519-dalek = "=3.0.0-rc.0"`, so the
# lock carries two ed25519-dalek trees (2.2.0 SBFB-stable +
# 3.0.0-rc.0 iroh-internal) and two duplicated `-rc` pre-releases
# (ed25519-dalek 3.0.0-rc.0 + curve25519-dalek 5.0.0-rc.0); 72
# multi-version groups total. Flip deferred as P2-AUDIT-2-RESIDUEL
# (carry S82); unblocks when an upstream iroh release moves
# ed25519-dalek 3.x off the RC line. SBFB security-critical crypto
# stays isolated on the stable 2.2.0/4.1.3 trees.
multiple-versions = "warn"
wildcards = "allow"         # Tightened in Sprint 19+
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Preemptive bans. SBFB does not currently depend on wasmtime,
# but Sprint 17 Phase E VALIDATED_BLUEPRINT identified 12 CVEs
# (2 Critical) patched in the April 2026 Bytecode Alliance
# advisory. This rule blocks any future PR that tries to add
# wasmtime without the patched version.
#
# Refs:
#   CVE-2026-34941 — heap OOB UTF-16 transcoding
#   CVE-2026-34946 — Winch table.fill panic
#   https://bytecodealliance.org/articles/wasmtime-security-advisories
#
# Policy: mainline pins `wasmtime >=43.0.1, <44`. LTS path
# `36.0.7+` re-evaluated Sprint 22+ if adoption grows.
deny = [
    { crate = "wasmtime:<43.0.1", reason = "CVE-2026-34941 + CVE-2026-34946, Bytecode Alliance advisory 2026-04-09" },
]

# Git sources are denied by default (see [sources]), but an
# explicit allowlist can live here if a specific fork is required.
allow-wildcard-paths = false

# --------------------------------------------------------------
# [sources] — where crates may be pulled from
# --------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
