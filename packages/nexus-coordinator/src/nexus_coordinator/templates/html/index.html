<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PROJECT_NAME}}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e5e5e5;
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    h1 { margin: 0; font-size: 2rem; }
    p  { color: #999; text-align: center; max-width: 32rem; }
    button {
      background: #34d399;
      color: #0a0a0f;
      border: 0;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #10b981; }
    pre {
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 0.5rem;
      max-width: 40rem;
      width: 100%;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>{{PROJECT_NAME}}</h1>
  <p>App SBFB minimale. Le bridge postMessage est installe et peut communiquer avec l'hote.</p>

  <button id="submit">Envoyer une task de demo</button>
  <pre id="output">(cliquez sur le bouton pour voir un resultat)</pre>

  <!--
    The SBFB Bridge SDK is served by the host shell at /sbfb-bridge.js.
    Inside a sandboxed iframe, we load it from the same origin.
    When this app is rendered OUTSIDE the SBFB shell (i.e. opened
    directly via `file://` for local dev), the bridge calls will
    fail silently — the bridge is a no-op target for postMessage.
  -->
  <script src="/sbfb-bridge.js"></script>
  <script>
    const bridge = new SBFBBridge();
    const output = document.getElementById("output");

    // Demo: subscribe to a push event. The host may push this event
    // when a task result is ready (Sprint 15 Phase A).
    bridge.onEvent("task_result_ready", (payload) => {
      output.textContent = "Event recu : " + JSON.stringify(payload, null, 2);
    });

    document.getElementById("submit").addEventListener("click", async () => {
      output.textContent = "Envoi en cours...";
      try {
        const result = await bridge.submitTask({
          prompt: "Bonjour depuis {{PROJECT_NAME}}",
        });
        output.textContent = "Resultat : " + JSON.stringify(result, null, 2);
      } catch (e) {
        output.textContent = "Erreur : " + e.message;
      }
    });
  </script>
</body>
</html>
