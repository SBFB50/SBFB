<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PROJECT_NAME}}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e5e5e5;
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    h1 { margin: 0; font-size: 2rem; }
    p  { color: #999; text-align: center; max-width: 32rem; }
    button {
      background: #fbbf24;
      color: #0a0a0f;
      border: 0;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    pre {
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 0.5rem;
      max-width: 40rem;
      width: 100%;
      overflow-x: auto;
    }
    .status { font-size: 0.875rem; color: #888; }
  </style>
</head>
<body>
  <h1>{{PROJECT_NAME}}</h1>
  <p>App SBFB avec Pyodide. Execute du Python directement dans le
  browser. Voir le README pour bundler Pyodide localement avant
  publication.</p>

  <div class="status" id="status">Chargement de Pyodide...</div>
  <button id="run" disabled>Executer Python</button>
  <pre id="output">(en attente de Pyodide)</pre>

  <!--
    Pyodide runtime. The default CSP of the SBFB blob-serve daemon
    is `default-src 'self' ...; connect-src 'none'`, which blocks
    fetching Pyodide from a CDN. This template expects Pyodide to
    be present under ./pyodide/ in the deployed zip. See README.md
    for how to bundle Pyodide 0.29.3 locally before publishing.
  -->
  <script src="./pyodide/pyodide.js"></script>

  <script src="/sbfb-bridge.js"></script>
  <script>
    const bridge = new SBFBBridge();
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    const runBtn = document.getElementById("run");

    let pyodide = null;

    async function loadPyodide() {
      try {
        // loadPyodide is a global provided by pyodide.js.
        pyodide = await window.loadPyodide({
          indexURL: "./pyodide/",
        });
        statusEl.textContent = "Pyodide pret — Python " + pyodide.runPython("import sys; sys.version.split()[0]");
        runBtn.disabled = false;
        outputEl.textContent = "Cliquez sur Executer pour lancer un calcul Python";
      } catch (e) {
        statusEl.textContent = "Erreur Pyodide : " + e.message;
        outputEl.textContent = "Verifie que ./pyodide/ contient bien le bundle Pyodide (cf. README.md).";
      }
    }

    runBtn.addEventListener("click", async () => {
      if (!pyodide) return;
      outputEl.textContent = "Calcul en cours...";
      try {
        const result = pyodide.runPython(`
import math
values = [math.sqrt(i) for i in range(10)]
f"Racines carrees de 0 a 9: {values}"
        `);
        outputEl.textContent = result;
      } catch (e) {
        outputEl.textContent = "Erreur Python : " + e.message;
      }
    });

    loadPyodide();
  </script>
</body>
</html>
