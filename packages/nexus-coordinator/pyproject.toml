[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-coordinator"
version = "1.0.0"
description = "nexus-grid coordinator — signs and dispatches LLM tasks to P2P workers via iroh-docs"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "FlowUP" }]
readme = "README.md"
keywords = ["p2p", "iroh", "llm", "distributed", "compute", "coordinator", "sbfb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core PyO3 wheel — provides the iroh Node, Doc, Gossip, Blobs,
    # Verifier, sign_task/sign_result/sign_claim bindings. Via uv
    # workspace path dep so a fresh `uv sync` at the repo root
    # rebuilds the wheel through maturin whenever the Rust side
    # changes. The PyPI package name is `nexus-core-py`; the
    # Python import name is `nexus_core` (set via maturin
    # `module-name`).
    "nexus-core-py",

    # Pydantic v2 + pydantic-settings for all config models. Env
    # var prefix NEXUS_COORD__ lets operators override any value
    # without editing coordinator.toml.
    "pydantic>=2.6",
    "pydantic-settings>=2.13",

    # FastAPI local control API bound to 127.0.0.1. Sprint 4
    # exposes /health + /project in Phase A, /tasks/submit +
    # /results + /kudos in Phase B, /invite/* in Phase C.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",

    # Typer + Rich for the `nexus-coordinator` CLI
    # (init/start/stop/invite/stats/kudos).
    "typer>=0.12",
    "rich>=13",

    # structlog for JSON-or-console structured logs shared with the
    # Rust worker's logging shape.
    "structlog>=25.5",

    # aiosqlite for the kudos ledger and the task_state table.
    "aiosqlite>=0.20",

    # RFC 8785 JCS canonical bytes on the Python side — matches
    # the Day 0 Rust switch to serde_jcs so both sides produce
    # byte-identical signing input. 0.2.1 is the current PyPI
    # release (stable since 2022-04-10, RFC is frozen).
    "jcs>=0.2.1",

    # PyNaCl for Ed25519 signing on the kudos ledger chain. The
    # coordinator keypair is shared with nexus-core-py signing
    # helpers, but pynacl gives us a pure-Python signing surface
    # for the per-row chain signature so the ledger stays
    # standalone and can be verified without a rust wheel.
    "pynacl>=1.5",

    # Cross-platform user-config-dir resolver (~/.nexus-grid/... on
    # every platform via platformdirs.user_data_dir).
    "platformdirs>=4.3",

    # tomli-w is stdlib-compatible for writing TOML back to disk
    # (tomllib only reads, as of Python 3.13).
    "tomli-w>=1.0",

    # Plugin SDK — the coordinator calls nexus_sdk.discover_apps()
    # at boot to mount every installed app under /app/<name>/...
    # Workspace path dep so a fresh `uv sync` rebuilds both crates
    # together.
    "nexus-sdk",

    # Sprint 21 phase coord-side — PII redaction layer 2 (complète
    # la couche iframe livrée phase B `d5b0035`) + output filter
    # local (InvisibleText scanner reimplémenté + EED prompt echo
    # detection via rapidfuzz Levenshtein, seuil 0.85 configurable).
    # Design doc : `.planning/research/S21_phase_C_output_filter_design.md`.
    #
    # Pivot D3 2026-04-19 : `llm-guard 0.3.16` (plan initial)
    # transitive-pin `presidio-analyzer==2.2.358`, incompatible
    # avec `presidio-analyzer>=2.2.362` requis par D2. Le scanner
    # `InvisibleText` de llm-guard étant ~30 lignes d'unicode
    # category checks + regex strip (pas de ML, pas de modèle),
    # il est ré-implémenté localement dans `output_filter.py` —
    # élimine ~500 MB de transitive deps (torch + transformers +
    # spaCy tirés par llm-guard pour scanners qu'on n'utilise
    # pas : Sensitive, NoRefusal, Relevance, URLReachability) et
    # débloque le graph deps. L'esprit du plan D3 (feature
    # InvisibleText + whitelist Cf pour RLO/LRO i18n) est
    # préservé par construction + parité testée.
    #
    # Presidio GLiNER reste chargé best-effort — en absence du
    # modèle HF cache local, le `PiiRedactor` degrade vers le
    # regex engine pur Python built-in (email/phone/CC/IBAN/
    # SSN/IP/URL).
    "presidio-analyzer[gliner]>=2.2.362",
    "rapidfuzz>=3.0",
]

[project.urls]
Homepage = "https://github.com/SBFB50/SBFB"
Repository = "https://github.com/SBFB50/SBFB"
Issues = "https://github.com/SBFB50/SBFB/issues"

[project.scripts]
nexus-coordinator = "nexus_coordinator.cli.main:app"
# Sprint 15 Phase C — developer CLI for scaffolding SBFB apps.
# `sbfb init <type> <path>` creates a new app from a bundled
# template (html / react / pyodide).
sbfb = "nexus_coordinator.cli.sbfb_main:app"

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    # Sprint 4 Phase D demo apps — pulled in for the test extra
    # so the coordinator test suite can exercise the entry_points
    # loader against a real NexusApp subclass.
    "nexus-app-gov",
    "nexus-hello-world-app",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_coordinator"]

# Sprint 15 Phase C — ship the scaffolding templates as package data
# so `sbfb init` can find them after `uv pip install nexus-coordinator`.
[tool.hatch.build.targets.wheel.force-include]
"src/nexus_coordinator/templates" = "nexus_coordinator/templates"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60

[tool.uv.sources]
nexus-core-py = { workspace = true }
nexus-sdk = { workspace = true }
nexus-app-gov = { workspace = true }
nexus-hello-world-app = { workspace = true }
