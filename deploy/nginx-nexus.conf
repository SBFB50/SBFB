#
# nginx site configuration for nexus-grid shell web.
# Copy to /etc/nginx/sites-available/nexus on the VPS.
#
# Serves the React SPA from /opt/nexus-grid/web/ and proxies
# API requests to the coordinator running on loopback.

server {
    listen 80;
    server_name _;

    root /opt/nexus-grid/web;
    index index.html;

    # SPA fallback — all non-file routes resolve to index.html
    # so React Router handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Coordinator API proxy (loopback only — no CORS needed).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Daemon API proxy (loopback only).
    location /daemon/ {
        proxy_pass http://127.0.0.1:7000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Blob serving — proxies to the daemon's blob-serve endpoint
    # for archived web apps rendered in sandboxed iframes.
    # Sprint 12 Phase D.
    location /blob-serve/ {
        proxy_pass http://127.0.0.1:7000/blob-serve/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Deny access to dotfiles.
    location ~ /\. {
        deny all;
    }
}
